<title>Spanish Growth Hub</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@400;600&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap">
<style>
/* Layout: sticky mission band + stat rail over a tabbed workspace, with a right-hand candidate drawer. */
:root{
  --paper:#F1F4F3; --surface:#FFFFFF; --surface-2:#E7ECEB; --surface-3:#DCE3E2;
  --ink:#141E1D; --ink-2:#485553; --ink-3:#74827F;
  --line:#D2D9D7; --line-2:#BCC6C4;
  --azulejo:#15607F; --azulejo-ink:#0E4458; --azulejo-soft:#D8E9F0;
  --marigold:#B4700A; --marigold-soft:#F8E8CB;
  --verde:#136C51; --verde-soft:#D0EADF;
  --rioja:#A11E34; --rioja-soft:#F7DADF; --on-accent:#FFFFFF;
  --violeta:#54387F; --violeta-soft:#E5DCF4;
  --shadow:0 1px 2px rgba(20,30,29,.06), 0 8px 24px -16px rgba(20,30,29,.35);
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
  --data:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#0E1618; --surface:#16211F; --surface-2:#1D2A28; --surface-3:#263533;
  --ink:#E9F0EE; --ink-2:#A6B4B1; --ink-3:#7C8A87;
  --line:#2A3836; --line-2:#3A4846;
  --azulejo:#58B6DC; --azulejo-ink:#9AD6EE; --azulejo-soft:#12303C;
  --marigold:#E7A646; --marigold-soft:#39280E;
  --verde:#46C392; --verde-soft:#0D3127;
  --rioja:#F28193; --rioja-soft:#3A151E; --on-accent:#06181F;
  --violeta:#AE92DF; --violeta-soft:#241B38;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.8);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#0E1618; --surface:#16211F; --surface-2:#1D2A28; --surface-3:#263533;
  --ink:#E9F0EE; --ink-2:#A6B4B1; --ink-3:#7C8A87;
  --line:#2A3836; --line-2:#3A4846;
  --azulejo:#58B6DC; --azulejo-ink:#9AD6EE; --azulejo-soft:#12303C;
  --marigold:#E7A646; --marigold-soft:#39280E;
  --verde:#46C392; --verde-soft:#0D3127;
  --rioja:#F28193; --rioja-soft:#3A151E; --on-accent:#06181F;
  --violeta:#AE92DF; --violeta-soft:#241B38;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.8);
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.015em}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--azulejo);outline-offset:2px;border-radius:4px}
a{color:var(--azulejo)}

.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:0}

/* ---------- mission band ---------- */
.band{position:relative;overflow:hidden;background:var(--surface);border-bottom:1px solid var(--line)}
.band::before{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 20%,color-mix(in srgb,var(--marigold) 16%,transparent) 45%,transparent 70%);background-size:260% 100%;animation:sheen 11s linear infinite;pointer-events:none}
@keyframes sheen{to{background-position:-260% 0}}
.band-in{position:relative;display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;padding-block:14px}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand h1{font-size:clamp(20px,3.4vw,28px);font-weight:800}
.brand .ene{color:var(--marigold)}
.brand small{font-family:var(--data);font-size:11px;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase}
.band-right{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.alarm{display:inline-flex;align-items:center;gap:8px;background:var(--rioja-soft);color:var(--rioja);border:1px solid color-mix(in srgb,var(--rioja) 35%,transparent);border-radius:999px;padding:6px 14px;font-family:var(--display);font-weight:800;font-size:12.5px;letter-spacing:.04em}
.alarm.calm{background:var(--verde-soft);color:var(--verde);border-color:color-mix(in srgb,var(--verde) 35%,transparent)}
.pulse{width:9px;height:9px;border-radius:50%;background:currentColor;animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.72)}}
.clock{text-align:right;font-family:var(--data)}
.clock .lbl{display:block;font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.clock .val{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}

/* ---------- stat rail ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:10px;padding-block:16px}
.stat{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 13px 11px;min-width:0;overflow:hidden;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer;transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease}
.stat:hover{transform:translateY(-2px);border-color:var(--accent,var(--azulejo));box-shadow:var(--shadow)}
.stat .n{transition:color .3s ease}
.stat.bump .n{animation:bump .6s cubic-bezier(.2,1.4,.4,1)}
@keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.28)}100%{transform:scale(1)}}
.stat::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent,var(--line-2))}
.stat .n,.stat .k,.stat .how{display:block}
.stat .n{font-family:var(--display);font-weight:800;font-size:30px;line-height:1;font-variant-numeric:tabular-nums;color:var(--accent,var(--ink))}
.stat .k{font-family:var(--data);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);margin-top:6px}
.stat .how{font-size:11.5px;color:var(--ink-3);margin-top:3px;line-height:1.35}
.stat.live .n{text-shadow:0 0 18px color-mix(in srgb,var(--accent) 45%,transparent)}

/* ---------- tabs ---------- */
/* search progress */
.progress{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 15px;margin-bottom:18px}
.progress .ph{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline;margin-bottom:9px}
.progress .ph b{font-family:var(--display);font-size:14.5px;font-weight:800}
.progress .ph span{font-family:var(--data);font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.track{height:10px;border-radius:5px;background:var(--surface-3);overflow:hidden;position:relative}
.track i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--azulejo),var(--marigold));box-shadow:0 0 16px color-mix(in srgb,var(--marigold) 60%,transparent);transition:width .8s cubic-bezier(.2,.8,.2,1)}
.track::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 35%,rgba(255,255,255,.4) 50%,transparent 65%);background-size:260% 100%;animation:sheen2 3.4s linear infinite;pointer-events:none}
@keyframes sheen2{to{background-position:-260% 0}}
.steps{display:flex;gap:10px;margin-top:9px;flex-wrap:wrap}
.steps span{font-family:var(--data);font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3)}
.steps span.done{color:var(--azulejo)}
.steps span.now{color:var(--marigold);font-weight:600}
.steps span.now::before{content:"\25CF ";animation:pulse 1.5s ease-in-out infinite;display:inline-block}
/* stars */
.stars{display:inline-flex;gap:1px;vertical-align:-2px;margin-right:3px}
.stars svg{width:11px;height:11px;display:block}
.s-on{fill:var(--marigold)} .s-off{fill:var(--surface-3)}
/* filters */
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 16px}
.filters button{background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-family:var(--data);font-size:11.5px;cursor:pointer;color:var(--ink-2)}
.filters button:hover{border-color:var(--azulejo)}
.filters button[aria-pressed="true"]{background:var(--azulejo);border-color:var(--azulejo);color:var(--on-accent);font-weight:600}
/* status change */
@keyframes flashmove{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--marigold) 75%,transparent);border-color:var(--marigold)}100%{box-shadow:0 0 0 16px transparent;border-color:var(--line)}}
.pcard.moved,.ccard.moved{animation:flashmove 1s ease-out}
@keyframes slidein{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.pcard{animation:slidein .3s ease-out}
/* chart tooltip */
#tip{position:fixed;z-index:80;background:var(--ink);color:var(--paper);font-family:var(--data);font-size:11px;padding:5px 9px;border-radius:6px;pointer-events:none;white-space:nowrap;box-shadow:var(--shadow)}
.spark rect[data-tip]{cursor:crosshair}
.spark .hv{opacity:0;transition:opacity .12s}
.spark g:hover .hv{opacity:1}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line);margin-bottom:20px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;background:none;border:0;border-bottom:3px solid transparent;padding:10px 13px;cursor:pointer;font-family:var(--display);font-weight:600;font-size:14.5px;color:var(--ink-2);white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--azulejo);border-bottom-color:var(--azulejo)}
.tab .cnt{font-family:var(--data);font-size:10.5px;background:var(--surface-2);border-radius:999px;padding:1px 6px;margin-left:5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.tab[aria-selected="true"] .cnt{background:var(--azulejo-soft);color:var(--azulejo)}

/* ---------- generic panel ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:16px}
.panel>h2{font-size:17px;font-weight:800;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.panel>h2 .tagline{font-family:var(--body);font-weight:400;font-size:13px;color:var(--ink-3);letter-spacing:0}
.sub{color:var(--ink-2);font-size:13.5px;margin:6px 0 0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px}
.eyebrow{font-family:var(--data);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin:0 0 8px}

/* ---------- buttons ---------- */
.btn{background:var(--azulejo);color:var(--on-accent);border:1px solid transparent;border-radius:8px;padding:8px 14px;font-family:var(--display);font-weight:600;font-size:13.5px;cursor:pointer;text-decoration:none;display:inline-block;line-height:1.35}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line-2)}
.btn.ghost:hover{background:var(--surface-2);filter:none}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btnrow{display:flex;flex-wrap:wrap;gap:8px}

/* ---------- fields ---------- */
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f label{font-family:var(--data);font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.f input,.f select,.f textarea{background:var(--surface);border:1px solid var(--line-2);border-radius:7px;padding:7px 9px;font-size:14px;width:100%}
.f textarea{resize:vertical;min-height:62px;line-height:1.45}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--azulejo)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:11px}

/* ---------- checklist ---------- */
.check{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px dashed var(--line);font-size:14px}
.check:last-child{border-bottom:0}
.check input{margin:3px 0 0;width:17px;height:17px;accent-color:var(--azulejo);flex:0 0 auto}
.check label{cursor:pointer;min-width:0}
.check input:checked+label{color:var(--ink-3);text-decoration:line-through}
.req{position:relative;padding:7px 0 7px 21px;border-bottom:1px dashed var(--line);font-size:14px}
.req:last-child{border-bottom:0}
.req::before{content:"";position:absolute;left:3px;top:13px;width:7px;height:7px;border-radius:2px;background:var(--azulejo)}

/* ---------- code / copy block ---------- */
.copyblock{position:relative;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:14px 14px 12px;max-height:290px;overflow:auto}
.copyblock pre{margin:0;font-family:var(--body);font-size:13.5px;white-space:pre-wrap;line-height:1.55;color:var(--ink-2)}

/* ---------- search links ---------- */
.searches{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:9px}
.search{display:block;background:var(--surface-2);border:1px solid var(--line);border-left:3px solid var(--azulejo);border-radius:8px;padding:10px 12px;text-decoration:none;color:inherit}
.search:hover{background:var(--azulejo-soft);border-color:var(--azulejo)}
.search b{display:block;font-family:var(--display);font-size:14px;font-weight:600}
.search span{font-family:var(--data);font-size:11px;color:var(--ink-3);word-break:break-word}

/* ---------- pipeline ---------- */
.pipe{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:10px}
.col{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;min-width:0;display:flex;flex-direction:column;gap:8px}
.col.drop{border-color:var(--azulejo);background:var(--azulejo-soft)}
.col>header{display:flex;align-items:center;justify-content:space-between;gap:6px}
.col h3{font-size:12.5px;font-family:var(--data);font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2);min-width:0;overflow-wrap:anywhere}
.col .cc{font-family:var(--data);font-size:11px;background:var(--surface-2);border-radius:999px;padding:1px 7px;color:var(--ink-2);flex:0 0 auto}
.pcard{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:9px 10px;cursor:grab;min-width:0}
.pcard:hover{border-color:var(--azulejo)}
.pcard.dragging{opacity:.45}
.pcard b{display:block;font-family:var(--display);font-size:14px;font-weight:600;overflow-wrap:anywhere}
.pcard .meta{font-family:var(--data);font-size:11px;color:var(--ink-3);margin-top:3px;display:flex;flex-wrap:wrap;gap:8px}
.pcard .warn{color:var(--rioja);font-weight:600}
.colempty{font-size:12px;color:var(--ink-3);font-style:italic;padding:6px 2px}

/* ---------- candidate cards ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(265px,1fr));gap:13px}
.ccard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0;text-align:left;cursor:pointer;font:inherit;color:inherit}
.ccard:hover{border-color:var(--azulejo);box-shadow:var(--shadow)}
.chead{display:flex;gap:11px;align-items:center;min-width:0}
.av{flex:0 0 auto;width:42px;height:42px;border-radius:11px;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:16px;color:#fff;background:var(--avbg,#15607F)}
.chead .who{min-width:0}
.chead .who b{display:block;font-family:var(--display);font-size:15.5px;font-weight:600;overflow-wrap:anywhere}
.chead .who span{font-family:var(--data);font-size:11px;color:var(--ink-3);overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-family:var(--data);font-size:10.5px;letter-spacing:.03em;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.chip.ok{background:var(--verde-soft);color:var(--verde);border-color:color-mix(in srgb,var(--verde) 30%,transparent)}
.chip.bad{background:var(--rioja-soft);color:var(--rioja);border-color:color-mix(in srgb,var(--rioja) 30%,transparent)}
.chip.unk{background:var(--marigold-soft);color:var(--marigold);border-color:color-mix(in srgb,var(--marigold) 30%,transparent)}
.chip.stage{background:var(--azulejo-soft);color:var(--azulejo);border-color:color-mix(in srgb,var(--azulejo) 30%,transparent)}
.meter{height:6px;border-radius:3px;background:var(--surface-3);overflow:hidden}
.meter i{display:block;height:100%;background:var(--azulejo);border-radius:3px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.meterrow{display:flex;align-items:center;gap:9px;font-family:var(--data);font-size:11px;color:var(--ink-3)}
.meterrow .meter{flex:1}

/* ---------- empty state ---------- */
.empty{border:2px dashed var(--line-2);border-radius:var(--r);padding:28px 20px;text-align:center;background:var(--surface)}
.empty h3{font-size:17px;font-weight:800}
.empty p{color:var(--ink-2);font-size:14px;max-width:52ch;margin:8px auto 14px}

/* ---------- drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,18,17,.5);z-index:40;backdrop-filter:blur(2px)}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(620px,100%);background:var(--paper);border-left:1px solid var(--line);z-index:41;display:flex;flex-direction:column;box-shadow:-20px 0 50px -30px rgba(0,0,0,.6)}
.drawer>header{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:14px 16px;border-top:env(safe-area-inset-top,0px) solid transparent;background:var(--surface);border-bottom:1px solid var(--line)}
.drawer .body{flex:1;overflow:auto;padding:16px 16px calc(28px + env(safe-area-inset-bottom,0px))}
.x{background:var(--surface-2);border:1px solid var(--line-2);border-radius:8px;width:32px;height:32px;cursor:pointer;font-size:17px;line-height:1;flex:0 0 auto}
.dsec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:13px}
.dsec>h3{font-size:14.5px;font-weight:800;margin-bottom:4px;display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.dsec>h3 em{font-family:var(--data);font-style:normal;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}

/* scorecard rows */
.scrow{display:grid;grid-template-columns:1fr auto;gap:7px 10px;padding:9px 0;border-bottom:1px solid var(--line)}
.scrow:last-child{border-bottom:0}
.scrow .nm{font-size:13.5px;font-weight:600;min-width:0;overflow-wrap:anywhere}
.scrow .nm .core{font-family:var(--data);font-size:9px;letter-spacing:.07em;background:var(--marigold-soft);color:var(--marigold);padding:1px 5px;border-radius:3px;margin-left:6px;vertical-align:1px}
.seg{display:flex;gap:3px;flex:0 0 auto}
.seg button{border:1px solid var(--line-2);background:var(--surface);border-radius:6px;padding:3px 8px;font-family:var(--data);font-size:10.5px;cursor:pointer;color:var(--ink-3)}
.seg button[aria-pressed="true"]{font-weight:600}
.seg button[data-v="strong"][aria-pressed="true"]{background:var(--verde);border-color:var(--verde);color:var(--surface)}
.seg button[data-v="partial"][aria-pressed="true"]{background:var(--marigold);border-color:var(--marigold);color:var(--surface)}
.seg button[data-v="weak"][aria-pressed="true"]{background:var(--rioja);border-color:var(--rioja);color:var(--surface)}
.seg button[data-v="unknown"][aria-pressed="true"]{background:var(--surface-3);border-color:var(--line-2);color:var(--ink)}
.scrow .ev{grid-column:1/-1}
.scrow .ev input{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:5px 8px;font-size:12.5px}
.scrow .ev input::placeholder{color:var(--ink-3);font-style:italic}

/* rating 1-5 */
.r5{display:flex;gap:3px}
.r5 button{width:28px;height:26px;border:1px solid var(--line-2);background:var(--surface);border-radius:6px;cursor:pointer;font-family:var(--data);font-size:11.5px;color:var(--ink-3)}
.r5 button[aria-pressed="true"]{background:var(--azulejo);border-color:var(--azulejo);color:var(--surface);font-weight:600}

/* red flags */
.flags{display:grid;gap:3px}
.flagrow{display:flex;gap:9px;align-items:flex-start;padding:6px 8px;border-radius:7px;font-size:13.5px}
.flagrow:has(input:checked){background:var(--rioja-soft);color:var(--rioja);font-weight:600}
.flagrow input{margin-top:3px;width:16px;height:16px;accent-color:var(--rioja);flex:0 0 auto}

/* interview */
.q{border-bottom:1px solid var(--line);padding:10px 0}
.q:last-child{border-bottom:0}
.qh{display:flex;gap:9px;align-items:flex-start}
.qh input{margin-top:3px;width:16px;height:16px;accent-color:var(--verde);flex:0 0 auto}
.qh label{font-size:13.5px;font-weight:600;cursor:pointer;min-width:0}

<script>
(function(){
"use strict";

/* ============================ reference content ============================ */
const STAGES=[
 {id:"sourcing",  label:"Sourcing"},
 {id:"screening", label:"Screening"},
 {id:"interview", label:"Interview"},
 {id:"trial",     label:"Trial Session"},
 {id:"review",    label:"Mariaelena Review"},
 {id:"selected",  label:"Selected"},
 {id:"hired",     label:"Hired"}
];
const STAGE_IX=Object.fromEntries(STAGES.map((s,i)=>[s.id,i]));

const CORE=["bilingual","american","hscurric","grammar","homework","testprep"];
const SCORECARD=[
 {id:"bilingual", label:"Bilingual English / Spanish"},
 {id:"american",  label:"Experience teaching American students"},
 {id:"hscurric",  label:"High-school Spanish curriculum experience"},
 {id:"grammar",   label:"Grammar instruction"},
 {id:"vocab",     label:"Vocabulary instruction"},
 {id:"reading",   label:"Reading"},
 {id:"writing",   label:"Writing"},
 {id:"spelling",  label:"Spelling"},
 {id:"pronunc",   label:"Pronunciation"},
 {id:"convo",     label:"Conversation"},
 {id:"homework",  label:"Homework assistance"},
 {id:"testprep",  label:"Quiz / test preparation"},
 {id:"explainEn", label:"Explains concepts in English"},
 {id:"scans",     label:"Works from scanned school assignments"},
 {id:"reliable",  label:"Reliability"},
 {id:"comms",     label:"Communication"},
 {id:"avail",     label:"Availability"},
 {id:"cost",      label:"Cost"}
];
const FLAGS=[
 {id:"f1", label:"Native speaker but little teaching experience"},
 {id:"f2", label:"Primarily conversational Spanish only"},
 {id:"f3", label:"Cannot explain grammar clearly in English"},
 {id:"f4", label:"No experience with American high-school coursework"},
 {id:"f5", label:"Tutor simply completes assignments for students"},
 {id:"f6", label:"Poor availability"},
 {id:"f7", label:"Slow communication"},
 {id:"f8", label:"Weak Upwork history"},
 {id:"f9", label:"Unclear English fluency"}
];
const QUESTIONS=[
 "Tell us about your experience teaching Spanish to American high-school students.",
 "How would you help a student who speaks very little Spanish understand verb conjugation?",
 "If we upload his homework before a lesson, how would you prepare?",
 "How do you determine what a student actually understands versus what he has memorized?",
 "How do you prepare students for quizzes and exams?",
 "How do you teach spelling and written Spanish?",
 "How much of the session would you conduct in English versus Spanish?",
 "Can you build lessons around what his teacher is currently covering?",
 "How do you track progress?",
 "What would you do if he starts falling behind?",
 "When can you start?"
];
const TRIAL=[
 {id:"t1",label:"Communication"},{id:"t2",label:"Patience"},
 {id:"t3",label:"Teaching ability"},{id:"t4",label:"Student engagement"},
 {id:"t5",label:"English explanations"},{id:"t6",label:"Spanish pronunciation"},
 {id:"t7",label:"Grammar instruction"},{id:"t8",label:"Preparedness"},
 {id:"t9",label:"Ability to use student's homework"},{id:"t10",label:"Student comfort"},
 {id:"t11",label:"Overall fit"}
];
const SKILLS=[
 {id:"reading",   icon:"\u{1F4D6}", label:"Reading"},
 {id:"writing",   icon:"✍️", label:"Writing"},
 {id:"speaking",  icon:"\u{1F5E3}️", label:"Speaking"},
 {id:"listening", icon:"\u{1F442}", label:"Listening"},
 {id:"vocab",     icon:"\u{1F524}", label:"Vocabulary"},
 {id:"grammar",   icon:"\u{1F9E0}", label:"Grammar"},
 {id:"homework",  icon:"\u{1F4DD}", label:"Homework"},
 {id:"testprep",  icon:"\u{1F3AF}", label:"Quiz / Test Prep"}
];
const LEVEL_NAMES=["Not started","Emerging","Developing","Steady","Strong","Confident"];
const REQUIREMENTS=[
 "Completely fluent in English and Spanish",
 "Has taught Spanish as it is taught in U.S. high schools",
 "Knows Spanish I / II / III-style curriculum: grammar, vocabulary, conjugation, spelling, reading, writing, pronunciation, conversation",
 "Works directly from the student's actual schoolwork",
 "Reviews uploaded or scanned homework, worksheets, study guides, quizzes, vocabulary lists and teacher instructions",
 "Identifies what the student does and does not understand",
 "Prepares him for quizzes and tests",
 "Helps him finish homework while teaching the material, never just handing over answers",
 "Teaches in English when explanation is needed, moves into Spanish as he improves",
 "Comfortable on Zoom or Google Meet",
 "Can work several times per week"
];
const PLAN=[
 "Post the position on Upwork",
 "Actively search Upwork instead of waiting only for applicants",
 "Contact promising tutors directly",
 "Screen applicants against the requirements",
 "Conduct short interviews",
 "Schedule trial sessions with the strongest candidates",
 "Present a small finalist group to Mariaelena",
 "Hire and begin tutoring as quickly as practical"
];
const HANDOFF=[
 "Read Juan's brief and the mission requirements",
 "Copy the job post below and post it on Upwork",
 "Run the Upwork talent searches and invite strong matches directly",
 "Add every promising tutor to the pipeline with rate, time zone and Upwork link",
 "Fill the scorecard with evidence, tick red flags, leave unknowns as unknown",
 "Interview the strongest using the 11 questions in each profile",
 "Book trial sessions using Lucas's current homework",
 "Move 2–3 finalists to Mariaelena Review and tell Cherry",
 "Send Cherry the daily update: found, interviewed, in trial"
];
const SEARCHES=[
 {t:"High-school Spanish tutor", q:"high school Spanish tutor"},
 {t:"Certified Spanish teacher", q:"certified Spanish teacher licensed"},
 {t:"Spanish I / II / III curriculum", q:"Spanish 1 2 3 high school curriculum tutor"},
 {t:"AP & Honors Spanish", q:"AP Spanish honors teacher tutor"},
 {t:"Homework-based Spanish tutoring", q:"Spanish tutor homework grammar conjugation"},
 {t:"Bilingual academic tutor, U.S. schools", q:"bilingual Spanish tutor American students online"}
];
const JOBPOST=`Online Spanish Tutor for U.S. High-School Student (Spanish I–III) — Several Sessions per Week

We are looking for an experienced Spanish tutor/educator to work one-on-one with our high-school son over Zoom or Google Meet, several times per week, starting as soon as possible. He recently changed schools and we want him caught up and confident in his current Spanish class.

IMPORTANT: We are not simply looking for a native Spanish speaker. We need an actual educator who understands how Spanish is taught academically in American high schools.

What you would do
• Teach directly from his real schoolwork — worksheets, study guides, vocabulary lists, quizzes and teacher instructions that we scan and upload before each lesson
• Work through homework with him while teaching the material, never just supplying answers
• Find the gap between what he has memorized and what he actually understands, and close it
• Prepare him for upcoming quizzes and tests
• Cover grammar, conjugation, vocabulary, spelling, reading comprehension, writing, pronunciation and conversation
• Explain in English when he needs it, and shift into Spanish as he improves
• Build each lesson around what his teacher is covering that week
• Keep short notes on progress and what still needs work

What we need from you
• Complete fluency in both English and Spanish
• Experience teaching Spanish to American high-school students (Spanish I / II / III-style curriculum)
• Comfort reviewing scanned or photographed assignments before a session
• Reliable availability for several sessions per week and fast communication
• Zoom or Google Meet, with a quiet setup

Nice to have
• Teaching credential, education degree, or U.S. classroom experience
• Experience with AP or Honors Spanish

To apply, please tell us
1. Your experience teaching Spanish to American high-school students
2. How you would explain verb conjugation to a student who speaks very little Spanish
3. How you would prepare if we sent you his homework the day before a lesson
4. Your weekly availability and time zone, and the earliest date you can start
5. Your hourly rate

Paid trial session required before we commit to an ongoing schedule.`;
const IRREGULAR=["ser","estar","ir","tener","hacer","poder","poner","decir","venir","dar","ver","saber","querer","salir","traer","conocer","haber","oir","oír","volver","dormir","pedir","jugar","empezar","pensar","entender","sentir","seguir","contar","perder","cerrar","almorzar","encontrar","recordar","mentir","morir","elegir","construir"];

/* ============================ plumbing ============================ */
const $=s=>document.querySelector(s);
const C=(typeof window!=="undefined"&&window.claude)?window.claude:null;
const use=n=>C&&C.use?C.use(n).catch(()=>null):Promise.resolve(null);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>"c"+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));

const Local={
 get(k){try{const v=localStorage.getItem("sgh:"+k);return v?JSON.parse(v):null}catch(e){return null}},
 set(k,v){try{localStorage.setItem("sgh:"+k,JSON.stringify(v))}catch(e){}},
 del(k){try{localStorage.removeItem("sgh:"+k)}catch(e){}},
 pre(p){try{return Object.keys(localStorage).filter(k=>k.indexOf("sgh:"+p)===0)}catch(e){return[]}}
};

const state={candidates:{},assignments:{},search:null,learning:null,board:null,tab:"command",open:null,mode:"loading",canWrite:true,filter:"all",justMoved:null};

const MILESTONES=[
 {id:"first",      hit:m=>m.found>=1,       msg:"First tutor in the pipeline \u2014 the search is live."},
 {id:"three",      hit:m=>m.found>=3,       msg:"Three tutors sourced \u2014 enough to compare properly."},
 {id:"screened",   hit:(m,L)=>L.some(c=>unknowns(c)===0), msg:"First tutor fully screened \u2014 all 18 criteria have evidence."},
 {id:"interviewed",hit:m=>m.interviewed>=1, msg:"First interview logged."},
 {id:"trial",      hit:m=>m.trial>=1,       msg:"First trial session under way."},
 {id:"finalist",   hit:m=>m.ready>=1,       msg:"First finalist is with Mariaelena."},
 {id:"shortlist",  hit:m=>m.finalists>=2,   msg:"Finalist group ready \u2014 time to tell Cherry."},
 {id:"hired",      hit:m=>m.hired>=1,       msg:"Tutor hired. Lucas starts learning."}
];
const FILTERS=[["all","All"],["qualified","Qualified"],["interviewed","Interviewed"],["flagged","Red flags"],["gaps","Needs screening"]];
function matchFilter(c){
 switch(state.filter){
  case "qualified": return isQualified(c);
  case "interviewed": return isInterviewed(c);
  case "flagged": return flagCount(c)>0;
  case "gaps": return unknowns(c)>0;
  default: return true;
 }
}
function checkMilestones(){
 const b=state.board||(state.board={});
 const done=b.milestones||(b.milestones={});
 const m=metrics(),L=list();
 let fired=null;
 for(const ms of MILESTONES){ if(!done[ms.id]&&ms.hit(m,L)){done[ms.id]=true;fired=ms.msg} }
 if(fired){saveMeta("board",0);celebrate();toast(fired)}
}

let DB=null,ASSETS=null,USER=null,MYID=null;
const chain=new Map();
function q(key,fn){const p=(chain.get(key)||Promise.resolve()).catch(()=>{}).then(fn);chain.set(key,p);return p.catch(e=>{console.warn("write failed",key,e);if(e&&e.code==="invalid_argument"){state.canWrite=false;render();toast("You have view-only access — changes are not saved.")}});}
const timers=new Map();
function later(key,fn,ms){clearTimeout(timers.get(key));timers.set(key,setTimeout(()=>q(key,fn),ms||550));}

function saveCandidate(c,ms){
 c.updatedAt=new Date().toISOString();
 state.candidates[c.id]=c;
 const body=Object.assign({},c); delete body.id;
 if(DB) later("c:"+c.id,()=>DB.collection("candidates").doc(c.id).set(body),ms);
 else {Local.set("cand:"+c.id,c);}
}
function removeCandidate(id){
 delete state.candidates[id];
 if(DB) q("c:"+id,()=>DB.collection("candidates").doc(id).delete());
 else Local.del("cand:"+id);
 render();
}
function saveMeta(key,ms){
 const body=state[key]||{};
 if(DB) later("m:"+key,()=>DB.doc("meta/"+key).set(body),ms);
 else Local.set("meta:"+key,body);
}
function saveAssignment(a){
 state.assignments[a.id]=a;
 const body=Object.assign({},a); delete body.id;
 if(DB) q("a:"+a.id,()=>DB.collection("assignments").doc(a.id).set(body));
 else Local.set("asg:"+a.id,a);
}
function removeAssignment(id){
 delete state.assignments[id];
 if(DB) q("a:"+id,()=>DB.collection("assignments").doc(id).delete());
 else Local.del("asg:"+id);
 render();
}

function onErr(e){ if(e&&e.code==="revoked"){state.canWrite=false;render();} else console.warn("db",e); }

async function boot(){
 render();
 DB=await use("db");
 if(DB){
  state.mode="db";
  DB.collection("candidates").onSnapshot(s=>{
    const next={}; s.docs.forEach(d=>{next[d.id]=Object.assign({id:d.id},d.data())});
    state.candidates=next; render();
  },onErr);
  DB.collection("assignments").onSnapshot(s=>{
    const next={}; s.docs.forEach(d=>{next[d.id]=Object.assign({id:d.id},d.data())});
    state.assignments=next; render();
  },onErr);
  DB.doc("meta/search").onSnapshot(s=>{state.search=s.exists?s.data():null;render();tick();},onErr);
  DB.doc("meta/learning").onSnapshot(s=>{state.learning=s.exists?s.data():null;render();},onErr);
  DB.doc("meta/board").onSnapshot(s=>{state.board=s.exists?s.data():null;render();},onErr);
 }else{
  state.mode="local";
  state.search=Local.get("meta:search");
  state.learning=Local.get("meta:learning");
  state.board=Local.get("meta:board");
  Local.pre("cand:").forEach(k=>{const c=Local.get(k.slice(4));if(c)state.candidates[c.id]=c});
  Local.pre("asg:").forEach(k=>{const a=Local.get(k.slice(4));if(a)state.assignments[a.id]=a});
  render();
 }
 use("assets").then(a=>{ASSETS=a;render()});
 use("user").then(async u=>{
   USER=u; if(!u)return;
   try{MYID=await u.id()}catch(e){}
   try{const w=await u.can("data.write"); if(w===false){state.canWrite=false;render()}}catch(e){}
 });
}

/* ============================ derived ============================ */
const list=()=>Object.values(state.candidates).sort((a,b)=>(a.createdAt||"").localeCompare(b.createdAt||""));
const ix=c=>STAGE_IX[c.stage]==null?0:STAGE_IX[c.stage];
function sc(c,id){return (c.scores&&c.scores[id])||{v:"unknown",e:""}}
function unknowns(c){return SCORECARD.filter(s=>sc(c,s.id).v==="unknown").length}
function flagCount(c){return FLAGS.filter(f=>c.flags&&c.flags[f.id]).length}
function isQualified(c){
 let strong=0;
 for(const k of CORE){const v=sc(c,k).v; if(v==="weak"||v==="unknown")return false; if(v==="strong")strong++;}
 return strong>=4;
}
function asked(c){return QUESTIONS.filter((_,i)=>c.interview&&c.interview.asked&&c.interview.asked["q"+i]).length}
const isInterviewed=c=>asked(c)>=8||ix(c)>=3;
function trialAvg(c){
 const s=(c.trial&&c.trial.scores)||{};
 const v=TRIAL.map(t=>s[t.id]).filter(n=>typeof n==="number"&&n>0);
 return v.length?v.reduce((a,b)=>a+b,0)/v.length:null;
}
const isFinalist=c=>ix(c)>=4&&(!c.review||c.review.decision!=="pass");
const readyForM=c=>c.stage==="review"&&(!c.review||!c.review.decision);
const hired=()=>list().find(c=>c.stage==="hired");

function metrics(){
 const L=list();
 return{
  found:L.length,
  qualified:L.filter(isQualified).length,
  interviewed:L.filter(isInterviewed).length,
  trial:L.filter(c=>c.stage==="trial").length,
  finalists:L.filter(isFinalist).length,
  ready:L.filter(readyForM).length,
  hired:L.filter(c=>c.stage==="hired").length
 };
}

/* ============================ elapsed clock ============================ */
function tick(){
 const el=$("#elapsed"),al=$("#alarm"),at=$("#alarmtext");
 if(!el)return;
 const h=hired();
 if(h){
  al.className="alarm calm"; at.textContent="TUTOR HIRED — "+(h.name||"").toUpperCase();
  el.textContent=state.search&&state.search.startedAt?fmtSpan(Date.now()-Date.parse(state.search.startedAt))+" to hire":"—";
  return;
 }
 al.className="alarm"; at.textContent="FIND A TUTOR ASAP";
 if(!state.search||!state.search.startedAt){el.textContent="not started";return}
 el.textContent=fmtSpan(Date.now()-Date.parse(state.search.startedAt));
}
function fmtSpan(ms){
 if(!(ms>=0))return "—";
 const m=Math.floor(ms/6e4),d=Math.floor(m/1440),h=Math.floor(m%1440/60),mm=m%60;
 if(d>0)return d+"d "+h+"h "+mm+"m";
 return h+"h "+mm+"m";
}

function stars(r){
 const n=Number(r); if(!(n>0))return "";
 const full=Math.round(Math.min(5,n));
 let out='<span class="stars" role="img" aria-label="Upwork rating '+esc(r)+' out of 5">';
 for(let i=1;i<=5;i++)out+='<svg viewBox="0 0 20 20" aria-hidden="true"><path class="'+(i<=full?"s-on":"s-off")+'" d="M10 1.6l2.5 5.2 5.7.8-4.1 4 1 5.7-5.1-2.7-5.1 2.7 1-5.7-4.1-4 5.7-.8z"/></svg>';
 return out+"</span>";
}

function spark(vals,label){
 const w=240,h=34,pad=5,n=vals.length;
 const X=i=>pad+i*(w-2*pad)/(n-1), Y=v=>h-pad-(v/5)*(h-2*pad);
 const line=vals.map((v,i)=>(i?"L":"M")+X(i).toFixed(1)+" "+Y(v).toFixed(1)).join(" ");
 const area=line+" L"+X(n-1).toFixed(1)+" "+(h-pad)+" L"+X(0).toFixed(1)+" "+(h-pad)+" Z";
 const band=(w-2*pad)/(n-1);
 const hits=vals.map((v,i)=>`<g><rect x="${Math.max(0,X(i)-band/2).toFixed(1)}" y="0" width="${band.toFixed(1)}" height="${h}" fill="transparent" data-tip="${esc(label)} &middot; week ${i+1}: ${v}/5 &mdash; ${esc(LEVEL_NAMES[v])}"/><circle class="hv" cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="3" fill="var(--marigold)" stroke="var(--surface)" stroke-width="1.6"/></g>`).join("");
 return `<svg class="spark" viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(label)} by week, out of 5: ${vals.join(", ")}">
   <line x1="${pad}" y1="${Y(0)}" x2="${w-pad}" y2="${Y(0)}" stroke="var(--line)" stroke-width="1"/>
   <path d="${area}" fill="var(--azulejo-soft)"/>
   <path d="${line}" fill="none" stroke="var(--azulejo)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
   <circle cx="${X(n-1).toFixed(1)}" cy="${Y(vals[n-1]).toFixed(1)}" r="3.2" fill="var(--azulejo)" stroke="var(--surface)" stroke-width="1.8"/>
   ${hits}
 </svg>`;
}
function conjugate(raw){
 const v=(raw||"").trim().toLowerCase();
 if(!v)return `<p class="sub" style="margin-top:12px">Enter a verb to see the six-person frame.</p>`;
 if(IRREGULAR.indexOf(v)>-1)return `<div class="note"><b>${esc(v)}</b> is irregular. The regular endings below would be wrong, so they are not shown &mdash; have the tutor write the real forms out with Lucas.</div>`;
 const m=/^(.*?)(ar|er|ir)$/.exec(v);
 if(!m)return `<div class="note">Spanish infinitives end in <b>-ar</b>, <b>-er</b> or <b>-ir</b>. Check the spelling.</div>`;
 const stem=m[1],end=m[2];
 const pres=end==="ar"?["o","as","a","amos","áis","an"]:end==="er"?["o","es","e","emos","éis","en"]:["o","es","e","imos","ís","en"];
 const pret=end==="ar"?["é","aste","ó","amos","asteis","aron"]:["í","iste","ió","imos","isteis","ieron"];
 const people=["yo","tú","él / ella / usted","nosotros","vosotros","ellos / ustedes"];
 return `<div class="tablewrap"><table class="conj">
  <tr><th></th><th style="width:33%">Presente</th><th style="width:33%">Pretérito</th></tr>
  ${people.map((p,i)=>`<tr><th>${esc(p)}</th><td>${esc(stem+pres[i])}</td><td>${esc(stem+pret[i])}</td></tr>`).join("")}
 </table></div>
 <div class="note">Regular <b>-${esc(end)}</b> pattern. Stem-changing and irregular verbs break this — check anything that looks odd with the tutor.</div>`;
}

 if(a==="learn"){const L=state.learning||(state.learning={});L[t.dataset.k]=t.value;saveMeta("learning");return}
 if(a==="verb"){const L=state.learning||(state.learning={});L.verb=t.value;saveMeta("learning");
   const out=document.getElementById("conjout");if(out)out.innerHTML=conjugate(t.value);return}
});

document.addEventListener("keydown",e=>{if(e.key==="Escape"&&state.open){state.open=null;render()}});

/* chart tooltip */
const tipEl=()=>document.getElementById("tip");
function placeTip(e){const el=tipEl();if(!el||el.hidden)return;
 const r=el.getBoundingClientRect();
 let x=e.clientX+12,y=e.clientY-r.height-10;
 if(x+r.width>innerWidth-8)x=e.clientX-r.width-12;
 if(y<4)y=e.clientY+16;
 el.style.left=x+"px";el.style.top=y+"px";}
document.addEventListener("mouseover",e=>{const n=e.target.closest("[data-tip]");if(!n)return;
 const el=tipEl();if(!el)return;el.innerHTML=n.getAttribute("data-tip");el.hidden=false;placeTip(e)});
document.addEventListener("mousemove",e=>{const el=tipEl();if(el&&!el.hidden)placeTip(e)});
document.addEventListener("mouseout",e=>{if(e.target.closest("[data-tip]")){const el=tipEl();if(el)el.hidden=true}});

/* drag and drop */
let drag=null;
document.addEventListener("dragstart",e=>{const n=e.target.closest("[data-card]");if(!n)return;
 drag=n.dataset.card;n.classList.add("dragging");
 if(e.dataTransfer){e.dataTransfer.effectAllowed="move";try{e.dataTransfer.setData("text/plain",drag)}catch(_){}}});
document.addEventListener("dragend",e=>{const n=e.target.closest("[data-card]");if(n)n.classList.remove("dragging");
 drag=null;document.querySelectorAll(".col.drop").forEach(x=>x.classList.remove("drop"))});
document.addEventListener("dragover",e=>{if(!drag)return;const col=e.target.closest("[data-drop]");if(!col)return;
 e.preventDefault();if(e.dataTransfer)e.dataTransfer.dropEffect="move";col.classList.add("drop")});
document.addEventListener("dragleave",e=>{const col=e.target.closest("[data-drop]");if(col&&!col.contains(e.relatedTarget))col.classList.remove("drop")});
document.addEventListener("drop",e=>{if(!drag)return;const col=e.target.closest("[data-drop]");if(!col)return;
 e.preventDefault();const id=drag;drag=null;col.classList.remove("drop");setStage(id,col.dataset.drop)});

/* file upload */
let pendingFile=null;
async function handleFile(f){
 const st=document.getElementById("a-status");
 if(!f||!ASSETS)return;
 if(st)st.textContent="Uploading "+f.name+"…";
 try{
  const r=await ASSETS.upload(f);
  pendingFile={id:r.id,url:r.url,name:f.name};
  if(st)st.textContent=f.name+" ready — now add the assignment";
 }catch(err){
  pendingFile=null;
  if(st)st.textContent="Upload failed ("+((err&&err.code)||"unknown")+"). Log the assignment and share the scan another way.";
 }
}

/* celebration */
function celebrate(){
 if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
 const cv=document.getElementById("confetti");if(!cv)return;
 const ctx=cv.getContext("2d");if(!ctx)return;
 cv.hidden=false;
 const dpr=Math.min(2,window.devicePixelRatio||1);
 cv.width=innerWidth*dpr;cv.height=innerHeight*dpr;cv.style.width=innerWidth+"px";cv.style.height=innerHeight+"px";
 ctx.setTransform(dpr,0,0,dpr,0,0);
 const colors=["#15607F","#B4700A","#136C51","#A11E34","#54387F","#58B6DC"];
 const bits=[];
 for(let i=0;i<130;i++)bits.push({x:innerWidth/2+(Math.random()-.5)*200,y:innerHeight*.32,
  vx:(Math.random()-.5)*9,vy:Math.random()*-11-3,g:.28+Math.random()*.16,
  w:5+Math.random()*7,h:3+Math.random()*5,r:Math.random()*6.28,vr:(Math.random()-.5)*.3,
  c:colors[i%colors.length],life:0});
 const t0=performance.now();
 (function frame(now){
  ctx.clearRect(0,0,innerWidth,innerHeight);
  let alive=0;
  for(const b of bits){
   b.vy+=b.g;b.x+=b.vx;b.y+=b.vy;b.r+=b.vr;b.life++;
   if(b.y<innerHeight+30){alive++;
    ctx.save();ctx.translate(b.x,b.y);ctx.rotate(b.r);
    ctx.globalAlpha=Math.max(0,1-b.life/150);
    ctx.fillStyle=b.c;ctx.fillRect(-b.w/2,-b.h/2,b.w,b.h);ctx.restore();}
  }
  if(alive&&now-t0<4200)requestAnimationFrame(frame);
  else{ctx.clearRect(0,0,innerWidth,innerHeight);cv.hidden=true}
 })(t0);
}

/* resolve reviewer names where the platform tells us */
async function paintNames(){
 if(!USER)return;
 const nodes=Array.from(document.querySelectorAll(".verdict[data-by]")).filter(n=>n.dataset.by);
 if(!nodes.length)return;
 try{
  const map=await USER.profiles(Array.from(new Set(nodes.map(n=>n.dataset.by))));
  nodes.forEach(n=>{const p=map&&map[n.dataset.by];const nm=p&&(p.name||"");
   const slot=n.querySelector(".byname"); if(slot&&nm)slot.textContent=" · by "+nm;});
 }catch(e){}
}
const _render=render;
render=function(){_render();paintNames()};

boot();
})();
</script>
