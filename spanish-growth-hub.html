<title>Spanish Growth Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,650&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Juan UI/UX standard (reference build: Madera Well Dashboard): sticky header, left tab rail, cards, status chips */
:root{
  --bg:#F3F5F2; --panel:#FFFFFF; --sunk:#E9EDE8; --ink:#1F2B2F; --muted:#5B6A6E; --faint:#8A989B;
  --line:#D8DDD8; --line-2:#C3CBC3;
  --clay:#8A5A3C; --sand:#E3D3B0; --water:#2F6F8F; --water-soft:#D6E7EF;
  --amber:#B8761A; --amber-soft:#F6E7CC; --ok:#2F7A4F; --ok-soft:#DCEFE3;
  --danger:#A33A2B; --danger-soft:#F5DEDA; --clay-soft:#EFE2D8; --on-accent:#FFFFFF; --plum:#6B4A7A; --plum-soft:#EAE1F1;
  --shadow:0 1px 2px rgba(31,43,47,.06); --pop:0 12px 32px rgba(31,43,47,.16);
  --serif:"Source Serif 4", Georgia, serif;
  --sans:"Public Sans", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#151B1D; --panel:#1D2528; --sunk:#232D30; --ink:#E7ECEA; --muted:#9AA8AB; --faint:#7B8A8D;
  --line:#313C3F; --line-2:#3E4A4D;
  --clay:#C98E68; --sand:#4A3F2C; --water:#6FB2D2; --water-soft:#1E3440;
  --amber:#E3A54A; --amber-soft:#3A2E1A; --ok:#6CC08F; --ok-soft:#1C3325;
  --danger:#E4826F; --danger-soft:#3D2320; --clay-soft:#33251C; --on-accent:#0E1719; --plum:#B392C9; --plum-soft:#2C2235;
  --shadow:none; --pop:0 12px 32px rgba(0,0,0,.5);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#151B1D; --panel:#1D2528; --sunk:#232D30; --ink:#E7ECEA; --muted:#9AA8AB; --faint:#7B8A8D;
  --line:#313C3F; --line-2:#3E4A4D;
  --clay:#C98E68; --sand:#4A3F2C; --water:#6FB2D2; --water-soft:#1E3440;
  --amber:#E3A54A; --amber-soft:#3A2E1A; --ok:#6CC08F; --ok-soft:#1C3325;
  --danger:#E4826F; --danger-soft:#3D2320; --clay-soft:#33251C; --on-accent:#0E1719; --plum:#B392C9; --plum-soft:#2C2235;
  --shadow:none; --pop:0 12px 32px rgba(0,0,0,.5);
}

/* ---------- Galaxy skin, in daylight ----------
   Same idea, no dark ground: a pale lilac sky with aurora washes and soft motes
   of light drifting through it. Declared on body so it wins over whichever theme
   the viewer's app set on :root. Text is deep slate because text has to be dark
   to be read on a light ground — every SURFACE here is light. */
body[data-skin="galaxy"]{
  color-scheme:light;
  --bg:#F3F1FB; --panel:rgba(255,255,255,.88); --sunk:#E7E3F6; --ink:#2B2A4A; --muted:#5D5B86; --faint:#8886AC;
  --line:#DED8F2; --line-2:#C7C0E6;
  --water:#2E6FB8; --water-soft:#DEEAFB;
  --ok:#1C7A55; --ok-soft:#D7F1E4;
  --amber:#9A6A0F; --amber-soft:#FBECCF;
  --clay:#9C5572; --clay-soft:#F8DFEB;
  --danger:#B32B45; --danger-soft:#FBDDE3;
  --plum:#6A4A9E; --plum-soft:#EBE1FA;
  --sand:#F0E7D4; --on-accent:#FFFFFF;
  --shadow:0 1px 2px rgba(62,56,112,.07), 0 10px 26px -20px rgba(62,56,112,.55);
  --pop:0 18px 48px rgba(62,56,112,.22);
  background-color:#F3F1FB;
  background-image:
    radial-gradient(2px 2px at 44px 70px, rgba(146,172,240,.30), transparent 60%),
    radial-gradient(2px 2px at 150px 24px, rgba(196,156,238,.26), transparent 60%),
    radial-gradient(2.6px 2.6px at 96px 160px, rgba(126,214,198,.24), transparent 60%),
    radial-gradient(2px 2px at 206px 118px, rgba(242,166,196,.22), transparent 60%),
    radial-gradient(1200px 660px at 12% -10%, rgba(140,170,255,.40), transparent 64%),
    radial-gradient(980px 580px at 90% -4%, rgba(208,160,252,.36), transparent 64%),
    radial-gradient(840px 560px at 50% 112%, rgba(128,228,208,.30), transparent 66%),
    radial-gradient(720px 520px at 76% 58%, rgba(255,186,208,.22), transparent 66%);
  background-size:250px 230px,250px 230px,250px 230px,250px 230px,100% 100%,100% 100%,100% 100%,100% 100%;
  background-attachment:fixed;
  background-repeat:repeat,repeat,repeat,repeat,no-repeat,no-repeat,no-repeat,no-repeat;
  animation:driftsky 240s linear infinite;
}
@keyframes driftsky{to{background-position:250px 230px,-250px 230px,250px -230px,-250px -230px,0 0,0 0,0 0,0 0}}
/* The canvas sky sits behind everything; the CSS wash above stays as the fallback
   for a view that cannot paint it. Once the canvas is live, .sky-live drops the
   tiled motes so they are not drawn twice. */
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;display:none}
body[data-skin="galaxy"] #sky{display:block}
body[data-skin="galaxy"] .layout{position:relative;z-index:1}
body[data-skin="galaxy"].sky-live{
  background-image:
    radial-gradient(1200px 660px at 12% -10%, rgba(140,170,255,.26), transparent 64%),
    radial-gradient(980px 580px at 90% -4%, rgba(208,160,252,.24), transparent 64%);
  background-size:100% 100%,100% 100%;
  background-repeat:no-repeat,no-repeat;
  animation:none;
}
body[data-skin="galaxy"] header.top{background:rgba(249,248,254,.86);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
body[data-skin="galaxy"] nav.rail{background:transparent}
body[data-skin="galaxy"] .tab:hover{background:rgba(255,255,255,.75)}
body[data-skin="galaxy"] .stat.lit .ic{background:rgba(255,255,255,.85)}
body[data-skin="galaxy"] .skill,body[data-skin="galaxy"] .pcard,
body[data-skin="galaxy"] .fact,body[data-skin="galaxy"] .copyblock{background:rgba(255,255,255,.62)}
body[data-skin="galaxy"] .scrim{background:rgba(43,42,74,.38)}
.skinbtn{display:inline-flex;align-items:center;gap:6px}
body[data-skin="galaxy"] .skinbtn{border-color:var(--plum);color:var(--plum)}
body[data-skin="galaxy"] .skinbtn:hover{border-color:var(--water);color:var(--water)}
@media (max-width:860px){ body[data-skin="galaxy"] nav.rail{background:rgba(249,248,254,.94)} }
*{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 96px)}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--sans);padding:0 20px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--water)}
:focus-visible{outline:3px solid var(--water);outline-offset:2px;border-radius:4px}
h1,h2{font-family:var(--serif);font-weight:650;margin:0;letter-spacing:-.005em;text-wrap:balance}
h1{font-size:24px} h2{font-size:22px}
h3,h4{font-family:var(--sans);font-size:16px;font-weight:600;margin:0}
.muted{color:var(--muted)}
.micro{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.sub{color:var(--muted);font-size:14.5px;margin:6px 0 0}
.tagline{font-family:var(--sans);font-weight:400;font-size:14px;color:var(--muted);letter-spacing:0}

/* ---------- sticky header ---------- */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);margin:0 -20px;padding:14px 20px 12px}
.toprow{max-width:1240px;margin:0 auto;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between}
.titleline{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 12px;min-width:0}
.idline{max-width:1240px;margin:4px auto 0;font-size:13px;color:var(--muted)}
.band-right{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.clock{text-align:right;line-height:1.15;white-space:nowrap}
.clock .lbl{display:block;font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--faint)}
.clock .val{font-family:var(--serif);font-size:20px;font-weight:650;font-variant-numeric:tabular-nums}

/* a quiet icon control: a preference, not an action, so it should not carry the
   same weight as Add tutor */
.vh{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.iconbtn{width:34px;height:34px;flex:0 0 auto;border:1.5px solid var(--line);background:var(--panel);border-radius:9px;
  display:grid;place-items:center;font-size:15px;line-height:1;color:var(--plum);padding:0}
.iconbtn:hover{border-color:var(--water);color:var(--water)}
.iconbtn[aria-pressed="true"]{background:var(--plum-soft);border-color:transparent;color:var(--plum)}
/* ---------- chips & badges ---------- */
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;white-space:nowrap;background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.unk{background:var(--amber-soft);color:var(--amber);border-color:transparent}
.chip.bad{background:var(--danger-soft);color:var(--danger);border-color:transparent}
.chip.stage{background:var(--water-soft);color:var(--water);border-color:transparent}
.badge{min-width:22px;text-align:center;border-radius:999px;padding:0 7px;font-size:12px;font-weight:700;background:var(--bg);color:var(--muted);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.badge.wait{background:var(--amber-soft);color:var(--amber);border-color:transparent}
.badge.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.alarm{display:inline-flex;align-items:center;gap:7px;background:var(--danger-soft);color:var(--danger);border-radius:999px;padding:5px 13px;font-weight:700;font-size:12.5px;letter-spacing:.02em;text-transform:uppercase}
.alarm.calm{background:var(--ok-soft);color:var(--ok)}
.pulse{width:8px;height:8px;border-radius:50%;background:currentColor;animation:pulse 2s ease-in-out infinite;flex:0 0 auto}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* ---------- layout + rail ---------- */
.layout{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:214px minmax(0,1fr);gap:24px;padding-block:20px 64px}
nav.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 96px);align-self:start;display:grid;gap:2px}
.rail .micro{padding:10px 10px 4px}
.railsep{height:1px;background:var(--line);margin:8px 10px}
.tab{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;border:0;background:none;border-radius:8px;padding:7px 10px;font-weight:500;font-size:15px;line-height:1.35;color:var(--ink)}
.tab:hover{background:var(--panel)}
.tab[aria-selected="true"]{background:var(--water-soft);color:var(--water);font-weight:700}
.tab[aria-selected="true"] .badge{background:var(--panel)}
.tab[disabled]{opacity:.5;cursor:default}
main{min-width:0;display:grid;gap:16px;align-content:start}

/* ---------- cards ---------- */
.card,.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px 18px;min-width:0}
.panel>h2{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.lead{border-left:5px solid var(--water);font-size:18px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.caveat{background:var(--amber-soft);border-radius:var(--r);padding:12px 16px;font-size:14px;margin-bottom:4px}
.caveat b{color:var(--amber)}
.banner{background:var(--amber-soft);border-radius:var(--r);padding:12px 16px;font-size:14px;margin-bottom:4px}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:26px 22px;text-align:center;color:var(--muted);font-size:14px;background:var(--panel)}
.empty h3{font-family:var(--serif);font-weight:650;font-size:19px;color:var(--ink)}
.empty p{max-width:56ch;margin:8px auto 14px}

/* ---------- stats ---------- */
.stats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
@media (max-width:1100px){.stats{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:560px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:13px 15px;min-width:0;width:100%;text-align:left;font:inherit;color:inherit;display:block;
  transition:background-color .35s ease,border-color .25s ease,transform .18s ease,box-shadow .25s ease}
.stat:hover{transform:translateY(-2px);box-shadow:var(--pop)}
.stat .top{display:flex;align-items:center;gap:10px}
.stat .ic{flex:0 0 auto;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:16px;background:var(--sunk);line-height:1;
  transition:background-color .35s ease,transform .35s cubic-bezier(.2,1.4,.4,1)}
.stat .k,.stat .how{display:block}
.stat .n{font-family:var(--serif);font-size:30px;font-weight:650;line-height:1;font-variant-numeric:tabular-nums;color:var(--faint)}
.stat .k{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-top:9px}
.stat .how{font-size:13px;color:var(--faint);margin-top:3px;line-height:1.4}
/* Colour means progress: a tile stays neutral at zero and lights up once it holds something. */
.stat.lit{background:var(--tint);border-color:transparent}
.stat.lit .ic{background:var(--panel);transform:scale(1.05)}
.stat.lit .n,.stat.lit .k{color:var(--accent)}
.stat.lit .how{color:var(--muted)}
.stat.win{background:var(--ok);border-color:transparent;box-shadow:0 0 0 3px var(--ok-soft)}
.stat.win .n,.stat.win .k,.stat.win .how{color:var(--on-accent)}
.stat.win .ic{background:rgba(255,255,255,.22)}
.stat.bump .n{animation:bump .6s cubic-bezier(.2,1.4,.4,1)}
@keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.2)}100%{transform:scale(1)}}

/* ---------- progress ---------- */
.progress{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px}
.progress .ph{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline;margin-bottom:10px}
.progress .ph b{font-family:var(--serif);font-size:17px;font-weight:650}
.progress .ph span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.track{height:8px;border-radius:999px;background:var(--sunk);overflow:hidden}
.track{position:relative}
.track i{display:block;height:100%;border-radius:999px;position:relative;
  background:linear-gradient(90deg,var(--water),var(--clay),var(--water));background-size:220% 100%;
  animation:drift 7s linear infinite;
  box-shadow:0 0 12px color-mix(in srgb,var(--clay) 55%,transparent);
  transition:width .9s cubic-bezier(.2,.8,.2,1)}
@keyframes drift{to{background-position:-220% 0}}
.steps{display:flex;gap:12px;margin-top:9px;flex-wrap:wrap}
.steps span{font-size:11.5px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:var(--faint)}
.steps span.done{color:var(--water)}
.steps span.now{color:var(--clay)}
.steps span.now::before{content:"\25CF ";}

/* ---------- milestones ---------- */
.miles{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:10px;margin-top:14px}
.mile{display:flex;gap:10px;align-items:flex-start;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:11px 13px;font-size:13.5px;color:var(--muted);min-width:0}
.mile .ic{flex:0 0 auto;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);font-size:12px;color:var(--faint);font-weight:700}
.mile.on{background:var(--ok-soft);border-color:transparent;color:var(--ink);font-weight:600;animation:popin .55s cubic-bezier(.2,1.4,.4,1)}
.mile.on .ic{background:var(--ok);color:var(--on-accent)}
@keyframes popin{0%{transform:scale(.94);opacity:.6}60%{transform:scale(1.03)}100%{transform:scale(1);opacity:1}}
.milehead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}

/* ---------- student progress ring ---------- */
.ring{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.ring svg{width:112px;height:112px;flex:0 0 auto}
.rtrack{fill:none;stroke:var(--sunk);stroke-width:11}
.rfill{fill:none;stroke-width:11;stroke-linecap:round;transition:stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 0 5px color-mix(in srgb,var(--water) 55%,transparent))}
.rnum{font-family:var(--serif);font-size:27px;font-weight:650;fill:var(--ink)}
.rlab{font-size:8.5px;font-weight:700;letter-spacing:.08em;fill:var(--muted)}
.ringside{min-width:0;flex:1 1 240px}
.ringside h3{font-family:var(--serif);font-size:19px;font-weight:650}
.ringside p{margin:5px 0 0;color:var(--muted);font-size:14px}
.wins{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-top:16px}
.win{border-radius:var(--r);padding:13px 15px;min-width:0}
.win.a{background:var(--amber-soft)} .win.b{background:var(--water-soft)}
.win h4{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;margin-bottom:7px;display:flex;align-items:center;gap:6px}
.win.a h4{color:var(--amber)} .win.b h4{color:var(--water)}
.win textarea{width:100%;background:var(--panel);border:1.5px solid transparent;border-radius:8px;padding:9px 11px;font-size:14px;min-height:62px;resize:vertical;line-height:1.5}
.win textarea:focus{border-color:var(--water)}
/* ---------- buttons ---------- */
.btn{border:1.5px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 14px;font-weight:600;font-size:14px;color:var(--ink);text-decoration:none;display:inline-block;line-height:1.4}
.btn:hover{border-color:var(--water);color:var(--water)}
.btn.primary,.btn:not(.ghost):not(.sm){background:var(--water);border-color:var(--water);color:var(--on-accent)}
.btn.primary:hover,.btn:not(.ghost):not(.sm):hover{color:var(--on-accent);filter:brightness(1.08)}
.btn.ghost{background:var(--panel);border-color:var(--line);color:var(--ink)}
.btn.ghost:hover{border-color:var(--water);color:var(--water);filter:none}
.btn.sm{padding:3px 10px;font-size:13px;background:var(--panel);border-color:var(--line);color:var(--ink)}
.btn.sm:hover{border-color:var(--water);color:var(--water)}
.btn.sm.primary{background:var(--water);border-color:var(--water);color:var(--on-accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* ---------- fields ---------- */
.f{display:grid;gap:4px;min-width:0}
.f label{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.f input,.f select,.f textarea{width:100%;padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--panel);font-size:15px}
.f textarea{resize:vertical;min-height:64px;line-height:1.5}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--water)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}

/* ---------- checklists ---------- */
.check{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.check:last-child{border-bottom:0}
.check input{margin:4px 0 0;width:17px;height:17px;accent-color:var(--water);flex:0 0 auto}
.check label{cursor:pointer;min-width:0}
.check input:checked+label{color:var(--faint);text-decoration:line-through}
.req{position:relative;padding:8px 0 8px 20px;border-bottom:1px solid var(--line);font-size:15px}
.req:last-child{border-bottom:0}
.req::before{content:"";position:absolute;left:2px;top:15px;width:7px;height:7px;border-radius:2px;background:var(--water)}
.who2{display:grid;grid-template-columns:100px minmax(0,1fr);gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.who2:last-child{border-bottom:0}
.who2 b{font-family:var(--serif);font-weight:650;color:var(--water)}

/* ---------- copy block & searches ---------- */
.copyblock{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;overflow:auto}
.copyblock pre{margin:0;font-family:var(--sans);font-size:14.5px;white-space:pre-wrap;line-height:1.6;color:var(--ink)}
.searches{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.search{display:grid;gap:3px;background:var(--water-soft);border:1px solid transparent;border-radius:var(--r);padding:12px 14px;text-decoration:none;color:var(--ink);min-width:0}
.search:hover{border-color:var(--water)}
.search b{font-size:15px;line-height:1.3}
.search span{font-size:13px;color:var(--muted);overflow-wrap:anywhere}

/* ---------- pipeline ---------- */
.pipe{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.col{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:11px;min-width:0;display:grid;gap:8px;align-content:start}
.col.drop{border-color:var(--water);background:var(--water-soft)}
.col>header{display:flex;align-items:center;justify-content:space-between;gap:6px}
.col h3{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);min-width:0;overflow-wrap:anywhere}
.pcard{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 11px;cursor:grab;min-width:0;animation:slidein .3s ease-out}
.pcard:hover{border-color:var(--water)}
.pcard.dragging{opacity:.45}
.pcard b{display:block;font-size:15px;font-weight:600;overflow-wrap:anywhere}
.pcard .meta{font-size:12.5px;color:var(--muted);margin-top:3px;display:flex;flex-wrap:wrap;gap:4px 10px}
.pcard .warn{color:var(--danger);font-weight:600}
.colempty{font-size:13px;color:var(--faint);font-style:italic;padding:4px 2px}
@keyframes slidein{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
@keyframes flash{0%{background:var(--amber-soft);border-color:var(--amber)}100%{background:var(--bg);border-color:var(--line)}}
.pcard.moved,.ccard.moved{animation:flash 1.4s ease-out}

/* ---------- candidate cards ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.ccard{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0;text-align:left;cursor:pointer;font:inherit;color:inherit}
.ccard:hover{border-color:var(--water)}
.chead{display:flex;gap:12px;align-items:center;min-width:0}
.av{flex:0 0 auto;width:44px;height:44px;border-radius:10px;display:grid;place-items:center;font-family:var(--serif);font-weight:650;font-size:17px;color:#fff;background:var(--avbg,#2F6F8F)}
.chead .who{min-width:0}
.chead .who b{display:block;font-size:17px;font-weight:650;line-height:1.3;overflow-wrap:anywhere}
.chead .who span{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.meter{height:6px;border-radius:999px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%;background:var(--water);border-radius:999px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.meterrow{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.meterrow .meter{flex:1}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.filters button{border:1.5px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 12px;font-size:13.5px;font-weight:600;color:var(--ink)}
.filters button:hover{border-color:var(--water)}
.filters button[aria-pressed="true"]{background:var(--water);border-color:var(--water);color:var(--on-accent)}

/* ---------- drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(21,27,29,.5);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);background:var(--bg);border-left:1px solid var(--line);z-index:41;display:flex;flex-direction:column;box-shadow:var(--pop)}
.drawer>header{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:14px 18px;padding-top:calc(14px + env(safe-area-inset-top,0px));background:var(--panel);border-bottom:1px solid var(--line)}
.drawer .body{flex:1;overflow:auto;padding:18px 18px calc(32px + env(safe-area-inset-bottom,0px));display:grid;gap:14px;align-content:start}
.x{background:var(--bg);border:1.5px solid var(--line);border-radius:8px;width:34px;height:34px;font-size:18px;line-height:1;flex:0 0 auto}
.x:hover{border-color:var(--water);color:var(--water)}
.dsec{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px 18px}
.dsec>h3{font-family:var(--serif);font-size:18px;font-weight:650;margin-bottom:4px;display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.dsec>h3 em{font-style:normal;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-family:var(--sans)}

/* scorecard */
.scrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;padding:10px 0;border-bottom:1px solid var(--line)}
.scrow:last-child{border-bottom:0}
.scrow .nm{font-size:14.5px;font-weight:600;min-width:0;overflow-wrap:anywhere}
.scrow .nm .core{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;background:var(--sand);color:var(--ink);padding:1px 6px;border-radius:4px;margin-left:7px;vertical-align:1px}
.seg{display:flex;gap:4px;flex:0 0 auto}
.seg button{border:1.5px solid var(--line);background:var(--panel);border-radius:7px;padding:3px 9px;font-size:12.5px;font-weight:600;color:var(--muted)}
.seg button:hover{border-color:var(--water)}
.seg button[data-v="strong"][aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--on-accent)}
.seg button[data-v="partial"][aria-pressed="true"]{background:var(--amber);border-color:var(--amber);color:var(--on-accent)}
.seg button[data-v="weak"][aria-pressed="true"]{background:var(--danger);border-color:var(--danger);color:var(--on-accent)}
.seg button[data-v="unknown"][aria-pressed="true"]{background:var(--sunk);border-color:var(--line-2);color:var(--ink)}
.scrow .ev{grid-column:1/-1}
.scrow .ev input{width:100%;background:var(--bg);border:1.5px solid var(--line);border-radius:7px;padding:6px 10px;font-size:13.5px}
.scrow .ev input::placeholder{color:var(--faint);font-style:italic}
.r5{display:flex;gap:4px}
.r5 button{width:30px;height:28px;border:1.5px solid var(--line);background:var(--panel);border-radius:7px;font-size:13px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.r5 button:hover{border-color:var(--water)}
.r5 button[aria-pressed="true"]{background:var(--water);border-color:var(--water);color:var(--on-accent)}
.flags{display:grid;gap:2px}
.flagrow{display:flex;gap:10px;align-items:flex-start;padding:7px 9px;border-radius:8px;font-size:14.5px}
.flagrow:has(input:checked){background:var(--danger-soft);color:var(--danger);font-weight:600}
.flagrow input{margin-top:4px;width:16px;height:16px;accent-color:var(--danger);flex:0 0 auto}
.q{border-bottom:1px solid var(--line);padding:11px 0}
.q:last-child{border-bottom:0}
.qh{display:flex;gap:10px;align-items:flex-start}
.qh input{margin-top:4px;width:16px;height:16px;accent-color:var(--ok);flex:0 0 auto}
.qh label{font-size:14.5px;font-weight:600;cursor:pointer;min-width:0}
.q textarea{margin-top:8px;width:100%;background:var(--bg);border:1.5px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14px;min-height:54px;resize:vertical}

/* ---------- Mariaelena ---------- */
.finalist{background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--clay);border-radius:var(--r);box-shadow:var(--shadow);padding:18px 20px}
.finalist.sel{border-color:var(--ok);border-top-color:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}
.finalist .fh{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.fh .av{width:58px;height:58px;font-size:22px;border-radius:12px}
.fh h3{font-family:var(--serif);font-size:22px;font-weight:650}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:16px 0}
.fact{background:var(--bg);border-radius:8px;padding:10px 12px;min-width:0}
.fact .k{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--faint)}
.fact .v{font-size:15px;font-weight:600;margin-top:2px;overflow-wrap:anywhere}
.sw{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-bottom:14px}
.sw>div{border-radius:var(--r);padding:12px 14px;font-size:14px}
.sw .good{background:var(--ok-soft)} .sw .care{background:var(--danger-soft)}
.sw h4{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;margin-bottom:6px}
.sw .good h4{color:var(--ok)} .sw .care h4{color:var(--danger)}
.sw ul{margin:0;padding-left:18px} .sw li{margin:3px 0}
.decide{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.dbtn{border:1.5px solid var(--line);background:var(--panel);border-radius:8px;padding:12px 10px;font-weight:700;font-size:14px;text-align:center;color:var(--ink)}
.dbtn:hover{border-color:currentColor}
.dbtn[data-d="approve"]{color:var(--water)} .dbtn[data-d="backup"]{color:var(--amber)}
.dbtn[data-d="pass"]{color:var(--muted)} .dbtn[data-d="select"]{color:var(--ok)}
.dbtn[aria-pressed="true"]{background:currentColor;border-color:currentColor}
.dbtn[aria-pressed="true"] span{color:var(--on-accent)}
.verdict{font-size:13px;color:var(--muted);margin-top:10px}

/* ---------- learning ---------- */
.locked{text-align:center;padding:40px 22px}
.locked .big{font-size:44px;line-height:1;margin-bottom:10px;opacity:.5}
.skills{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.skill{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0}
.skill .sh{display:flex;align-items:center;gap:8px;justify-content:space-between}
.skill .sh b{font-size:15px;font-weight:650;display:flex;gap:7px;align-items:center;min-width:0}
.skill .lvl{font-size:12.5px;color:var(--muted);flex:0 0 auto;font-variant-numeric:tabular-nums}
.bars{display:flex;gap:3px;margin:10px 0 8px}
.bars i{height:8px;flex:1;border-radius:999px;background:var(--sunk);cursor:pointer}
.bars i.on{background:var(--water)}
.spark{display:block;width:100%;height:auto}
.sparknote{font-size:12.5px;color:var(--faint);font-style:italic}
.wf{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px}
.wf span{background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:600;color:var(--muted)}
.wf span.on{background:var(--water-soft);border-color:transparent;color:var(--water)}
.wf i{color:var(--faint);font-style:normal}
.streak{display:inline-flex;align-items:center;gap:7px;background:var(--amber-soft);color:var(--amber);border-radius:999px;padding:5px 13px;font-weight:700;font-size:13px}
.flame{animation:flicker 2.2s ease-in-out infinite;display:inline-block}
@keyframes flicker{0%,100%{transform:scale(1) rotate(-2deg)}50%{transform:scale(1.12) rotate(3deg)}}
.conj{width:100%;border-collapse:collapse;font-size:14.5px;margin-top:10px}
.conj th,.conj td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left}
.conj th{font-size:11.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);width:34%}
.conj td{font-weight:600}
.conj tr:last-child th,.conj tr:last-child td{border-bottom:0}
.tablewrap{overflow-x:auto}
.note{background:var(--amber-soft);border-radius:8px;padding:10px 13px;font-size:14px;margin-top:10px}
.note b{color:var(--amber)}
.hwrow{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.hwrow:last-child{border-bottom:0}
.hwrow .hl{min-width:0}
.hwrow b{font-size:15px;display:block;overflow-wrap:anywhere}
.hwrow .hm{font-size:12.5px;color:var(--muted)}

/* ---------- quick add ---------- */
.quick{border:1px solid var(--water);border-radius:var(--r);box-shadow:var(--shadow);padding:16px 18px;background:var(--panel)}
.quick>h2{display:flex;align-items:baseline;gap:10px;justify-content:space-between;flex-wrap:wrap}
.quick .added{font-size:13px;font-weight:600;color:var(--ok)}
.quick .dupe{background:var(--amber-soft);color:var(--amber);border-radius:8px;padding:9px 12px;font-size:13.5px;margin-top:10px}
.addbtn{display:inline-flex;align-items:center;gap:6px}
.addbtn::before{content:"+";font-size:17px;line-height:1;font-weight:700;margin-top:-1px}
/* ---------- import ---------- */
.imp{border:1px solid var(--water);border-radius:var(--r);box-shadow:var(--shadow);padding:16px 18px;background:var(--panel)}
.imp>h3{font-family:var(--serif);font-size:18px;font-weight:650;display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
.imp textarea{width:100%;min-height:100px;background:var(--bg);border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;font-size:14px;resize:vertical;margin-top:10px;line-height:1.5}
.imp .hint{font-size:13.5px;color:var(--muted);margin:7px 0 0}
.thinking{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--water);padding:10px 0}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--water-soft);border-top-color:var(--water);animation:spin .8s linear infinite;flex:0 0 auto}
@keyframes spin{to{transform:rotate(360deg)}}
.sugg{border-top:1px solid var(--line);margin-top:13px;padding-top:12px}
.sugg h4{font-size:11.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.srow{display:grid;grid-template-columns:auto minmax(0,1fr);gap:9px;padding:8px 0;border-bottom:1px solid var(--line);align-items:start}
.srow:last-child{border-bottom:0}
.srow input[type=checkbox]{width:16px;height:16px;margin-top:4px;accent-color:var(--water)}
.srow .sv{min-width:0}
.srow .sk,.srow .sval{display:block}
.srow .sk{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--faint);margin-bottom:2px}
.srow .sval{font-size:14.5px;font-weight:600;overflow-wrap:anywhere}
.srow q{display:block;font-size:13.5px;color:var(--muted);font-style:italic;margin-top:4px;border-left:3px solid var(--line);padding-left:10px;overflow-wrap:anywhere}
.srow .rate{font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px;margin-left:7px;text-transform:uppercase;letter-spacing:.03em}
.rate.strong{background:var(--ok-soft);color:var(--ok)}
.rate.partial{background:var(--amber-soft);color:var(--amber)}
.rate.weak{background:var(--danger-soft);color:var(--danger)}
.leftunknown{font-size:13.5px;color:var(--muted);margin-top:12px;line-height:1.55}
.imperr{background:var(--danger-soft);color:var(--danger);border-radius:8px;padding:10px 13px;font-size:13.5px;margin-top:10px}

/* ---------- presence ---------- */
.presence{display:flex;align-items:center;gap:7px;min-width:0}
.pstack{display:flex;flex:0 0 auto}
.pav{width:27px;height:27px;border-radius:50%;display:grid;place-items:center;font-family:var(--serif);font-weight:650;font-size:11px;color:#fff;border:2px solid var(--bg);margin-left:-8px;flex:0 0 auto;background:var(--avbg,#2F6F8F)}
.pstack .pav:first-child{margin-left:0}
.pav.me{box-shadow:0 0 0 2px var(--clay)}
.plabel{font-size:12px;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:5px}
.pmore{font-size:11.5px;font-weight:700;color:var(--muted);background:var(--sunk);border-radius:999px;padding:2px 7px;flex:0 0 auto}
.livedot{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:0 0 auto}
.livedot.off{background:var(--faint)}
.watchers{display:flex;flex:0 0 auto}
.watchers .pav{width:21px;height:21px;font-size:9px;margin-left:-6px;border-width:1.5px}
.whoon{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--clay);margin-top:8px;font-weight:600}
.cardwatch{position:absolute;top:12px;right:12px;display:flex}

/* ---------- misc ---------- */
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:14px;font-weight:600;z-index:60;box-shadow:var(--pop)}
#tip{position:fixed;z-index:80;background:var(--ink);color:var(--bg);font-size:12.5px;padding:5px 10px;border-radius:7px;pointer-events:none;white-space:nowrap;box-shadow:var(--pop)}
.spark .hv{opacity:0;transition:opacity .12s}
.spark g:hover .hv{opacity:1}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:70}
footer{color:var(--faint);font-size:12.5px;padding-block:20px 10px;border-top:1px solid var(--line);grid-column:1/-1}
.stars{display:inline-flex;gap:1px;vertical-align:-2px;margin-right:4px}
.stars svg{width:11px;height:11px;display:block}
.s-on{fill:var(--amber)} .s-off{fill:var(--sunk)}

@media (max-width:860px){
 body{padding:0 16px}
 header.top{margin:0 -16px;padding:12px 16px 10px}
 .layout{grid-template-columns:minmax(0,1fr);gap:14px;padding-top:0}
 nav.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);z-index:15;display:flex;overflow-x:auto;gap:4px;background:var(--bg);margin:0 -16px;padding:8px 16px;border-bottom:1px solid var(--line);scrollbar-width:none}
 nav.rail::-webkit-scrollbar{display:none}
 .rail .micro,.railsep{display:none}
 .tab{width:auto;flex:0 0 auto;white-space:nowrap}
 .clock{text-align:left}
 .drawer{width:100%}
 .who2{grid-template-columns:minmax(0,1fr);gap:2px}
}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}
</style>

<script>
/* Galaxy is the default. Applied here, before the page paints, so a viewer who has
   not opted out never sees the old theme flash first. */
(function(){
 var hub=false;
 try{var v=localStorage.getItem("sgh:skin"); hub=!!v&&JSON.parse(v)==="hub";}catch(e){}
 if(!hub)document.body.dataset.skin="galaxy";
 var b=document.querySelector('[data-act="skin"]'), l=document.getElementById("skinlabel");
 if(b){b.setAttribute("aria-pressed",String(!hub));
       b.title=hub?"Switch to the Galaxy theme":"Switch to the hub theme";}
 if(l)l.textContent=hub?"Galaxy":"Hub theme";
})();
</script>

<script>
(function(){
"use strict";

/* ============================ reference content ============================ */

/* The prompt is the quality control. It forbids inference and requires a verbatim
   quote for every claim, so anything the text does not support simply does not come back. */
function importPrompt(text){
 return `You are helping screen a tutor for Lucas, a U.S. high-school student taking Spanish I-III.
Below is text copied from an Upwork freelancer profile and/or their proposal.

RULES
- Use ONLY what the text actually states. Never infer, never guess, never use general knowledge.
- Every claim must carry "quote": a verbatim span of at most 150 characters copied from the text.
- If you cannot quote it, OMIT it. An omission is correct and useful; a guess is harmful.
- Do not translate or paraphrase inside "quote". Copy it exactly.

Reply with ONLY this JSON:
{"fields":{"<fieldId>":{"value":"...","quote":"..."}},
 "scores":[{"id":"<criterionId>","rating":"strong|partial|weak","quote":"..."}],
 "flags":[{"id":"<flagId>","quote":"..."}],
 "whyFit":"one or two sentences, grounded in the text",
 "strengths":["short line","short line"],
 "concerns":["short line"]}

fieldId is one of: ${IMPORT_FIELDS.map(f=>f[0]+" ("+f[1]+")").join(", ")}

criterionId is one of: ${SCORECARD.map(x=>x.id+" ("+x.label+")").join(", ")}
rating: "strong" = direct specific evidence; "partial" = touched on thinly or indirectly;
"weak" = the text gives evidence AGAINST it. Omit any criterion the text does not address.

flagId is one of: ${FLAGS.map(f=>f.id+" ("+f.label+")").join(", ")}
Only raise a flag the text genuinely supports. No flag is the normal answer.

TEXT:
${text}`;
}

 if(!(ms>=0))return "—";
 const m=Math.floor(ms/6e4),d=Math.floor(m/1440),h=Math.floor(m%1440/60),mm=m%60;
 if(d>0)return d+"d "+h+"h "+mm+"m";
 return h+"h "+mm+"m";
}

const reduced=()=>{try{return matchMedia("(prefers-reduced-motion: reduce)").matches}catch(e){return false}};
function countUp(el,from,to){
 if(!el)return;
 if(reduced()||from===to||from==null){el.textContent=to;return}
 const t0=performance.now(),d=650;
 (function step(now){
  const k=Math.min(1,(now-t0)/d);
  el.textContent=Math.round(from+(to-from)*(1-Math.pow(1-k,3)));
  if(k<1)requestAnimationFrame(step); else el.textContent=to;
 })(t0);
}

}

function spark(vals,label){
 const w=240,h=34,pad=5,n=vals.length;
 const X=i=>pad+i*(w-2*pad)/(n-1), Y=v=>h-pad-(v/5)*(h-2*pad);
 const line=vals.map((v,i)=>(i?"L":"M")+X(i).toFixed(1)+" "+Y(v).toFixed(1)).join(" ");
 const area=line+" L"+X(n-1).toFixed(1)+" "+(h-pad)+" L"+X(0).toFixed(1)+" "+(h-pad)+" Z";
 const band=(w-2*pad)/(n-1);
 const hits=vals.map((v,i)=>`<g><rect x="${Math.max(0,X(i)-band/2).toFixed(1)}" y="0" width="${band.toFixed(1)}" height="${h}" fill="transparent" data-tip="${esc(label)} &middot; week ${i+1}: ${v}/5 &mdash; ${esc(LEVEL_NAMES[v])}"/><circle class="hv" cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="3" fill="var(--amber)" stroke="var(--panel)" stroke-width="1.6"/></g>`).join("");
 return `<svg class="spark" viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(label)} by week, out of 5: ${vals.join(", ")}">
   <line x1="${pad}" y1="${Y(0)}" x2="${w-pad}" y2="${Y(0)}" stroke="var(--line)" stroke-width="1"/>
   <path d="${area}" fill="var(--water-soft)"/>
   <path d="${line}" fill="none" stroke="var(--water)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
   <circle cx="${X(n-1).toFixed(1)}" cy="${Y(vals[n-1]).toFixed(1)}" r="3.2" fill="var(--water)" stroke="var(--panel)" stroke-width="1.8"/>
   ${hits}
 </svg>`;
}
function conjugate(raw){
 const v=(raw||"").trim().toLowerCase();
 if(!v)return `<p class="sub" style="margin-top:12px">Enter a verb to see the six-person frame.</p>`;
 if(IRREGULAR.indexOf(v)>-1)return `<div class="note"><b>${esc(v)}</b> is irregular. The regular endings below would be wrong, so they are not shown &mdash; have the tutor write the real forms out with Lucas.</div>`;
 const m=/^(.*?)(ar|er|ir)$/.exec(v);
 if(!m)return `<div class="note">Spanish infinitives end in <b>-ar</b>, <b>-er</b> or <b>-ir</b>. Check the spelling.</div>`;
 const stem=m[1],end=m[2];
 const pres=end==="ar"?["o","as","a","amos","áis","an"]:end==="er"?["o","es","e","emos","éis","en"]:["o","es","e","imos","ís","en"];
 const pret=end==="ar"?["é","aste","ó","amos","asteis","aron"]:["í","iste","ió","imos","isteis","ieron"];
 const people=["yo","tú","él / ella / usted","nosotros","vosotros","ellos / ustedes"];
 return `<div class="tablewrap"><table class="conj">
  <tr><th></th><th style="width:33%">Presente</th><th style="width:33%">Pretérito</th></tr>
  ${people.map((p,i)=>`<tr><th>${esc(p)}</th><td>${esc(stem+pres[i])}</td><td>${esc(stem+pret[i])}</td></tr>`).join("")}
 </table></div>
 <div class="note">Regular <b>-${esc(end)}</b> pattern. Stem-changing and irregular verbs break this — check anything that looks odd with the tutor.</div>`;
}

/* No action may fail silently: an exception used to stop the handler before
   render(), which looked exactly like a dead button. */
function reportBug(err){
 const msg=(err&&(err.message||err.code))||String(err);
 try{console.error("Spanish Growth Hub:",err)}catch(e){}
 if(imp.open||imp.res)imp.err="Something went wrong applying this: "+msg+". Nothing was lost \u2014 send this message to Claude.";
 try{render()}catch(e){}
 toast("Something went wrong: "+msg);
}
function guard(fn){return function(e){try{fn(e)}catch(err){reportBug(err)}}}

/* ============================ import ============================ */
/* A URL is not profile text. Strip links before measuring, so pasting the
   address alone can never arm the button. */
function impEnough(){
 if(imp.files&&imp.files.length)return true;
 return imp.text.replace(/https?:\/\/\S+/g,"").trim().length>60;
}
function impOnlyLink(){
 const t=imp.text.trim();
 return t.length>0 && /^https?:\/\//.test(t) && t.replace(/https?:\/\/\S+/g,"").trim().length<=60;
}
/* Claude's reply is untrusted shape. Normalize ONCE here so the row list, the
   button count and what apply writes can never disagree: ratings are lowercased
   and validated, unknown ids dropped, duplicates collapsed, and a string where an
   array was expected is accepted. */
function impClean(r){
 r=(r&&typeof r==="object"&&!Array.isArray(r))?r:{};
 const txt=v=>(typeof v==="string")?v:(typeof v==="number"||typeof v==="boolean")?String(v):"";
 const arr=v=>Array.isArray(v)?v.map(txt).map(x=>x.trim()).filter(Boolean):(txt(v).trim()?[txt(v).trim()]:[]);
 const src=(r.fields&&typeof r.fields==="object"&&!Array.isArray(r.fields))?r.fields:{};
 const fields={};
 IMPORT_FIELDS.forEach(f=>{
  const v=src[f[0]];
  const val=(v&&typeof v==="object"&&!Array.isArray(v))?txt(v.value).trim():txt(v).trim();
  if(val)fields[f[0]]={value:val.slice(0,300),quote:((v&&typeof v==="object")?txt(v.quote):"").slice(0,300)};
 });
 const seen={},scores=[];
 (Array.isArray(r.scores)?r.scores:[]).forEach(x=>{
  if(!x||typeof x!=="object")return;
  const id=txt(x.id).trim(), rating=txt(x.rating).trim().toLowerCase();
  if(!SCORECARD.some(y=>y.id===id)||["strong","partial","weak"].indexOf(rating)<0||seen["s"+id])return;
  seen["s"+id]=1; scores.push({id,rating,quote:txt(x.quote).slice(0,300)});
 });
 const flags=[];
 (Array.isArray(r.flags)?r.flags:[]).forEach(x=>{
  const id=((x&&typeof x==="object")?txt(x.id):txt(x)).trim();
  if(!FLAGS.some(y=>y.id===id)||seen["r"+id])return;
  seen["r"+id]=1; flags.push({id,quote:((x&&typeof x==="object")?txt(x.quote):"").slice(0,300)});
 });
 return {fields,scores,flags,whyFit:txt(r.whyFit).trim(),strengths:arr(r.strengths),concerns:arr(r.concerns)};
}
function impReset(){if(imp.ctl)try{imp.ctl.abort()}catch(e){}
 imp.open=false;imp.text="";imp.busy=false;imp.err="";imp.res=null;imp.pick={};imp.files=null;imp.ctl=null;}
/* Facts and ratings start ticked; red flags do not - a flag is an accusation and
   deserves a deliberate tick. */
function impDefaults(r){
 const pick={};
 Object.keys(r.fields).forEach(k=>{pick["f:"+k]=true});
 r.scores.forEach(x=>{pick["s:"+x.id]=true});
 r.flags.forEach(x=>{pick["r:"+x.id]=false});
 if(r.whyFit)pick["w:whyFit"]=true;
 if(Array.isArray(r.strengths)&&r.strengths.length)pick["w:strengths"]=true;
 if(Array.isArray(r.concerns)&&r.concerns.length)pick["w:concerns"]=true;
 return pick;
}
const IMP_ERR={
 not_granted:"You declined letting this page use Claude, so reading profiles is off for this visit.",
 sampling_disabled:"Claude is not available on this account, so the reader cannot run.",
 not_declared:"The reader is no longer available on this hub.",
 rate_limited:"Too many requests just now, or your Claude usage limit was reached. Try again in a few minutes.",
 session_expired:"Your Claude session expired. Sign in again, then retry.",
 refused:"Claude declined to read that text. Try pasting just the profile section.",
 empty_completion:"Claude returned nothing. Try pasting more of the profile.",
 invalid_json:"Claude's answer came back malformed. Press Read it again.",
 prompt_too_large:"That is too much text. Paste the profile overview and work history, not the whole page.",
 image_rejected:"That image could not be read. Try a PNG or JPEG screenshot under 20 MB.",
 images_unavailable:"Screenshots are not supported in this view. Paste the text instead.",
 cancelled:"",
 upstream_error:"The connection dropped before Claude finished. Press Read it to try again."
};
async function runImport(){
 const c=cur(); if(!c||!SAMPLE)return;
 imp.busy=true;imp.err="";imp.res=null;render();
 imp.ctl=new AbortController();
 const opts={signal:imp.ctl.signal,modelTier:"default"};
 if(imp.files&&imp.files.length&&IMGOK)opts.images=imp.files;
 const text=imp.text.trim().slice(0,120000);
 try{
  const r=await SAMPLE.json(importPrompt(text||"(no text pasted - read the attached screenshots)"),opts);
  imp.busy=false;
  if(!r||typeof r!=="object"||Array.isArray(r)){imp.err="Claude's answer was not in the expected shape. Press Read it again.";render();return}
  imp.res=impClean(r); imp.pick=impDefaults(imp.res); render();
 }catch(e){
  imp.busy=false;
  const code=(e&&e.code)||"upstream_error";
  if(code==="not_granted"||code==="sampling_disabled"||code==="not_declared"||code==="capability_disabled"||code==="capability_removed"){
    imp.err=IMP_ERR[code]||"Reading profiles is not available here."; SAMPLE=null; render(); return;
  }
  imp.err=IMP_ERR[code]||"That did not work. Press Read it to try again.";
  render();
 }
}
function applyImport(){
 const c=cur(), r=imp.res;
 if(!r){imp.err="Those suggestions are no longer loaded. Press Start over and paste again.";render();return}
 if(!c){imp.err="This tutor is no longer open. Close and reopen them, then paste again.";render();return}
 let n=0;
 Object.keys(imp.pick).forEach(k=>{
  if(!imp.pick[k])return;
  const kind=k.slice(0,1), id=k.slice(2);
  if(kind==="f"){const v=r.fields[id]; if(v){c[id]=v.value;n++}}
  else if(kind==="s"){const x=r.scores.find(y=>y.id===id);
    if(x){c.scores=Object.assign({},c.scores);c.scores[id]={v:x.rating,e:x.quote};n++}}
  else if(kind==="r"){if(r.flags.some(y=>y.id===id)){c.flags=Object.assign({},c.flags);c.flags[id]=true;n++}}
  else if(kind==="w"){
    if(id==="whyFit"&&r.whyFit){c.whyFit=r.whyFit;n++}
    if(id==="strengths"&&r.strengths.length){c.strengths=r.strengths.join("\n");n++}
    if(id==="concerns"&&r.concerns.length){c.concerns=r.concerns.join("\n");n++}
  }
 });
 if(!n){imp.err="Nothing was ticked, so nothing changed. Tick a row first, or press Start over.";render();return}
 saveCandidate(c,0); impReset(); render(); checkMilestones();
 toast(n+" item"+(n===1?"":"s")+" applied \u2014 the rest stay unknown.");
}

   timers.set("impl",setTimeout(()=>{if(imp.open&&!imp.busy&&!imp.res)render()},500));
   return}
 if(a==="cf"&&c){c[t.dataset.k]=t.value;saveCandidate(c);softRender();return}
 if(a==="ev"&&c){const s=t.dataset.s;c.scores=Object.assign({},c.scores);c.scores[s]=Object.assign({v:"unknown"},c.scores[s],{e:t.value});saveCandidate(c);softRender();return}
 if(a==="qa"&&c){c.interview=Object.assign({answers:{},asked:{}},c.interview);c.interview.answers=Object.assign({},c.interview.answers);
   c.interview.answers["q"+t.dataset.n]=t.value;saveCandidate(c);softRender();return}
 if(a==="tf"&&c){c.trial=Object.assign({scores:{}},c.trial);c.trial[t.dataset.k]=t.value;saveCandidate(c);softRender();return}
 if(a==="learn"){const L=state.learning=Object.assign({},state.learning);L[t.dataset.k]=t.value;saveMeta("learning");return}
 if(a==="verb"){const L=state.learning=Object.assign({},state.learning);L.verb=t.value;saveMeta("learning");
   const out=document.getElementById("conjout");if(out)out.innerHTML=conjugate(t.value);return}
}));

document.addEventListener("keydown",guard(e=>{
 if(e.key==="Escape"&&state.open){state.open=null;impReset();render();return}
 if(e.key==="Escape"&&state.quick&&!state.open){state.quick=false;qaClear();render();return}
 /* Enter anywhere in the quick form adds the tutor and keeps the form open */
 if(e.key==="Enter"&&state.quick&&!state.open){
  const t=e.target;
  if(t&&t.dataset&&t.dataset.act==="qa"&&qa.name.trim()){
   e.preventDefault();
   const b=document.querySelector('[data-act="qasave"]'); if(b)b.click();
  }
 }
}));

/* chart tooltip */
const tipEl=()=>document.getElementById("tip");
function placeTip(e){const el=tipEl();if(!el||el.hidden)return;
 const r=el.getBoundingClientRect();
 let x=e.clientX+12,y=e.clientY-r.height-10;
 if(x+r.width>innerWidth-8)x=e.clientX-r.width-12;
 if(y<4)y=e.clientY+16;
 el.style.left=x+"px";el.style.top=y+"px";}
document.addEventListener("mouseover",e=>{const n=e.target.closest("[data-tip]");if(!n)return;
 const el=tipEl();if(!el)return;el.innerHTML=n.getAttribute("data-tip");el.hidden=false;placeTip(e)});
document.addEventListener("mousemove",e=>{const el=tipEl();if(el&&!el.hidden)placeTip(e)});
document.addEventListener("mouseout",e=>{if(e.target.closest("[data-tip]")){const el=tipEl();if(el)el.hidden=true}});

/* drag and drop */
let drag=null;
document.addEventListener("dragstart",e=>{const n=e.target.closest("[data-card]");if(!n)return;
 drag=n.dataset.card;n.classList.add("dragging");
 if(e.dataTransfer){e.dataTransfer.effectAllowed="move";try{e.dataTransfer.setData("text/plain",drag)}catch(_){}}});
document.addEventListener("dragend",e=>{const n=e.target.closest("[data-card]");if(n)n.classList.remove("dragging");
 drag=null;document.querySelectorAll(".col.drop").forEach(x=>x.classList.remove("drop"))});
document.addEventListener("dragover",e=>{if(!drag)return;const col=e.target.closest("[data-drop]");if(!col)return;
 e.preventDefault();if(e.dataTransfer)e.dataTransfer.dropEffect="move";col.classList.add("drop")});
document.addEventListener("dragleave",e=>{const col=e.target.closest("[data-drop]");if(col&&!col.contains(e.relatedTarget))col.classList.remove("drop")});
document.addEventListener("drop",e=>{if(!drag)return;const col=e.target.closest("[data-drop]");if(!col)return;
 e.preventDefault();const id=drag;drag=null;col.classList.remove("drop");setStage(id,col.dataset.drop)});

/* file upload */
let pendingFile=null;
async function handleFile(f){
 const st=document.getElementById("a-status");
 if(!f||!ASSETS)return;
 if(st)st.textContent="Uploading "+f.name+"…";
 try{
  const r=await ASSETS.upload(f);
  pendingFile={id:r.id,url:r.url,name:f.name};
  if(st)st.textContent=f.name+" ready — now add the assignment";
 }catch(err){
  pendingFile=null;
  if(st)st.textContent="Upload failed ("+((err&&err.code)||"unknown")+"). Log the assignment and share the scan another way.";
 }
}

/* ============================ the sky ============================
   A real starfield rather than a tiled image: three parallax depths, per-star
   twinkle, a nebula drifting behind them and the occasional meteor.
   Built for a steady 60fps:
   - stars are pre-rendered sprites, so no per-star gradient or shadowBlur
   - draws are batched into ten alpha buckets, so globalAlpha is set ten times
     a frame instead of five hundred
   - the nebula is rendered once at quarter scale and blitted
   - the loop pauses when the tab is hidden and holds a single static frame
     under prefers-reduced-motion */
const Sky=(function(){
 const cv=document.getElementById("sky");
 if(!cv||!cv.getContext)return{start(){},stop(){},stats(){return null}};
 let ctx=null; try{ctx=cv.getContext("2d",{alpha:true})}catch(e){}
 if(!ctx)return{start(){},stop(){},stats(){return null}};

 /* Tinted motes, not white stars: on a light ground white is invisible. */
 const TINTS=["#7E9BEE","#B98CEC","#5FCDB4","#F09ABA","#9FB6F2"];
 const sprites=TINTS.map(c=>{
  const n=document.createElement("canvas"); n.width=n.height=24;
  const g=n.getContext("2d"), r=g.createRadialGradient(12,12,0,12,12,12);
  g.globalCompositeOperation="source-over";
  r.addColorStop(0,c); r.addColorStop(.22,c);
  r.addColorStop(.45,hexA(c,.45));
  r.addColorStop(1,hexA(c,0));
  g.fillStyle=r; g.beginPath(); g.arc(12,12,12,0,6.283); g.fill();
  return n;
 });
 function hexA(h,a){const n=parseInt(h.slice(1),16);
  return "rgba("+((n>>16)&255)+","+((n>>8)&255)+","+(n&255)+","+a+")";}

 let W=0,H=0,dpr=1,stars=[],bright=[],neb=null,raf=0,running=false,last=0,t=0;
 let meteor=null,nextMeteor=9000;
 /* Quality governor. On a weak machine the cost is the per-frame canvas upload,
    not the drawing, so drawing less does not help — updating less often does.
    Level 2 renders every frame, level 1 every other (a smooth 30 instead of a
    stuttering 28), level 0 leaves a still sky. It steps down only, so it cannot
    oscillate, and resets on resize or when the theme is switched back on. */
 let level=2, renderGaps=[], lastRender=0, lastAdapt=0;
 const BUCKETS=10, bins=[]; for(let i=0;i<BUCKETS;i++)bins.push([]);
 let frames=0,drawMs=0,sampleFrom=0;

 const reduce=()=>{try{return matchMedia("(prefers-reduced-motion: reduce)").matches}catch(e){return false}};

 function buildNebula(){
  const n=document.createElement("canvas");
  n.width=Math.max(2,Math.ceil(W/4)); n.height=Math.max(2,Math.ceil(H/4));
  const g=n.getContext("2d");
  const blobs=[[.18,-.05,.82,"rgba(132,166,255,.46)"],[.86,.02,.70,"rgba(203,150,252,.44)"],
               [.52,1.06,.76,"rgba(116,224,202,.38)"],[.70,.55,.52,"rgba(255,176,204,.32)"],
               [.33,.62,.44,"rgba(154,194,255,.28)"]];
  for(const [x,y,r,c] of blobs){
   const cx=x*n.width, cy=y*n.height, rad=r*Math.max(n.width,n.height);
   const gr=g.createRadialGradient(cx,cy,0,cx,cy,rad);
   gr.addColorStop(0,c); gr.addColorStop(1,"rgba(0,0,0,0)");
   g.fillStyle=gr; g.fillRect(0,0,n.width,n.height);
  }
  neb=n;
 }

 function build(){
  const rect=cv.getBoundingClientRect();
  W=Math.max(1,Math.round(rect.width)); H=Math.max(1,Math.round(rect.height));
  /* The cost here is compositing the canvas, not drawing into it: a 2560x1440
     window at 2x is 14.7M device pixels and drops to ~15fps however cheap the
     draw is. Cap the backing store by total pixels and let the browser scale it
     up — imperceptible on soft star sprites, and it holds 60fps on big displays. */
  const MAXPX=2400000;
  dpr=Math.min(2,window.devicePixelRatio||1);
  const fit=Math.sqrt(MAXPX/(W*H));
  if(fit<dpr)dpr=Math.max(0.75,fit);
  cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const target=Math.round(W*H/5200);
  const count=Math.max(160,Math.min(820,target));
  stars=[]; bright=[];
  for(let i=0;i<count;i++){
   const d=i%3;                                   /* 0 far, 1 mid, 2 near */
   stars.push({
    x:Math.random()*W, y:Math.random()*H, d:d,
    s:(d===0?2.2:d===1?3.6:5.4)+Math.random()*(d===2?4.2:1.8),
    a:(d===0?0.17:d===1?0.27:0.40)*(0.65+Math.random()*0.35),
    c:(Math.random()*TINTS.length)|0,
    ph:Math.random()*6.283, tw:0.5+Math.random()*1.6
   });
  }
  const nb=Math.max(4,Math.round(count/90));
  for(let i=0;i<nb;i++)bright.push({
   x:Math.random()*W, y:Math.random()*H, s:16+Math.random()*14,
   a:0.16+Math.random()*0.14, c:(Math.random()*TINTS.length)|0,
   ph:Math.random()*6.283, tw:0.35+Math.random()*0.5
  });
  buildNebula();
 }

 function spawnMeteor(){
  const fromLeft=Math.random()<0.5;
  meteor={x:fromLeft?-80:W+80, y:Math.random()*H*0.55,
          vx:(fromLeft?1:-1)*(0.55+Math.random()*0.35), vy:0.22+Math.random()*0.16,
          life:0, span:900+Math.random()*500, len:120+Math.random()*90};
 }

 function frame(now){
  if(!running)return;
  raf=requestAnimationFrame(frame);
  const dt=Math.min(64,now-(last||now)); last=now; t+=dt;
  if(level===1&&lastRender&&now-lastRender<30)return;
  if(level===0){ running=false; cancelAnimationFrame(raf); }
  const t0=performance.now();
  ctx.clearRect(0,0,W,H);

  /* nebula, drifting a few pixels a minute */
  if(neb){
   const nx=Math.sin(t/92000)*14, ny=Math.cos(t/121000)*10;
   ctx.globalAlpha=1;
   ctx.drawImage(neb,nx-14,ny-10,W+28,H+20);
  }

  /* stars, batched by quantised alpha */
  for(let i=0;i<BUCKETS;i++)bins[i].length=0;
  const drift=t/1000;
  for(let i=0;i<stars.length;i++){
   const st=stars[i];
   const sp=(st.d===0?1.1:st.d===1?2.6:4.8);
   let x=st.x+drift*sp*0.35, y=st.y-drift*sp*0.12;
   x%=W; if(x<0)x+=W; y%=H; if(y<0)y+=H;
   st.px=x; st.py=y;
   const a=st.a*(0.6+0.4*Math.sin(t/1000*st.tw+st.ph));
   let b=(a*BUCKETS)|0; if(b<0)b=0; if(b>=BUCKETS)b=BUCKETS-1;
   bins[b].push(st);
  }
  for(let b=0;b<BUCKETS;b++){
   const list=bins[b]; if(!list.length)continue;
   ctx.globalAlpha=(b+0.5)/BUCKETS;
   for(let i=0;i<list.length;i++){
    const st=list[i], s=st.s;
    ctx.drawImage(sprites[st.c],st.px-s/2,st.py-s/2,s,s);
   }
  }

  /* a few anchors with a wider halo */
  for(let i=0;i<bright.length;i++){
   const st=bright[i];
   ctx.globalAlpha=st.a*(0.65+0.35*Math.sin(t/1000*st.tw+st.ph));
   ctx.drawImage(sprites[st.c],st.x-st.s/2,st.y-st.s/2,st.s,st.s);
  }

  /* meteor */
  nextMeteor-=dt;
  if(!meteor&&nextMeteor<=0){spawnMeteor();nextMeteor=14000+Math.random()*16000;}
  if(meteor){
   meteor.life+=dt;
   const k=meteor.life/meteor.span;
   if(k>=1){meteor=null;}
   else{
    const x=meteor.x+meteor.vx*meteor.life, y=meteor.y+meteor.vy*meteor.life;
    const tx=x-meteor.vx*meteor.len, ty=y-meteor.vy*meteor.len;
    const fade=Math.sin(Math.PI*k);
    const g=ctx.createLinearGradient(x,y,tx,ty);
    g.addColorStop(0,"rgba(132,106,206,"+(0.50*fade).toFixed(3)+")");
    g.addColorStop(1,"rgba(132,106,206,0)");
    ctx.globalAlpha=1; ctx.strokeStyle=g; ctx.lineWidth=1.6; ctx.lineCap="round";
    ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(tx,ty); ctx.stroke();
   }
  }
  ctx.globalAlpha=1;

  drawMs+=performance.now()-t0; frames++;
  if(lastRender){ renderGaps.push(now-lastRender); if(renderGaps.length>70)renderGaps.shift(); }
  lastRender=now;
  adapt(now);
 }

 function median(a){ const b=a.slice().sort((x,y)=>x-y); return b[b.length>>1]; }
 function adapt(now){
  if(renderGaps.length<50||now-lastAdapt<1800)return;
  const m=median(renderGaps);
  if(level===2&&m>22){ level=1; lastAdapt=now; renderGaps.length=0; return; }
  /* only go still if even half rate is out of reach */
  if(level===1&&m>60){ level=0; lastAdapt=now; renderGaps.length=0; }
 }

 function start(){
  if(running)return;
  build(); document.body.classList.add("sky-live");
  frames=0; drawMs=0; sampleFrom=performance.now(); last=0;
  level=2; renderGaps.length=0; lastRender=0; lastAdapt=0;
  if(reduce()){ running=true; frame(performance.now()); running=false; cancelAnimationFrame(raf); return; }
  running=true; raf=requestAnimationFrame(frame);
 }
 function stop(){ running=false; cancelAnimationFrame(raf);
  document.body.classList.remove("sky-live"); ctx.clearRect(0,0,W,H); }
 function stats(){ const secs=(performance.now()-sampleFrom)/1000;
  return {frames:frames, fps:secs>0?frames/secs:0, avgDrawMs:frames?drawMs/frames:0,
          stars:stars.length, running:running, scale:dpr,
          backingPx:cv.width*cv.height, level:level,
          renderFps:renderGaps.length?1000/median(renderGaps):0}; }

 let rt=0;
 addEventListener("resize",()=>{ clearTimeout(rt);
  rt=setTimeout(()=>{ if(document.body.dataset.skin==="galaxy"){ const was=running; stop();
   if(was||reduce())start(); } },180); });
 document.addEventListener("visibilitychange",()=>{
  if(document.hidden){ if(running){running=false;cancelAnimationFrame(raf);} }
  else if(document.body.dataset.skin==="galaxy"&&!running&&!reduce()){
   running=true; last=0; raf=requestAnimationFrame(frame); }
 });
 return {start,stop,stats};
})();
function syncSky(){ if(document.body.dataset.skin==="galaxy")Sky.start(); else Sky.stop(); }
/* read-only diagnostic: lets anyone check the sky's real cost on their own device */
try{window.__skyStats=Sky.stats}catch(e){}

/* celebration */
function celebrate(){
 if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
 const cv=document.getElementById("confetti");if(!cv)return;
 const ctx=cv.getContext("2d");if(!ctx)return;
 cv.hidden=false;
 const dpr=Math.min(2,window.devicePixelRatio||1);
 cv.width=innerWidth*dpr;cv.height=innerHeight*dpr;cv.style.width=innerWidth+"px";cv.style.height=innerHeight+"px";
 ctx.setTransform(dpr,0,0,dpr,0,0);
 const colors=["#2F6F8F","#B8761A","#2F7A4F","#8A5A3C","#E3D3B0","#6FB2D2"];
 const bits=[];
 for(let i=0;i<130;i++)bits.push({x:innerWidth/2+(Math.random()-.5)*200,y:innerHeight*.32,
  vx:(Math.random()-.5)*9,vy:Math.random()*-11-3,g:.28+Math.random()*.16,
  w:5+Math.random()*7,h:3+Math.random()*5,r:Math.random()*6.28,vr:(Math.random()-.5)*.3,
  c:colors[i%colors.length],life:0});
 const t0=performance.now();
 (function frame(now){
  ctx.clearRect(0,0,innerWidth,innerHeight);
  let alive=0;
  for(const b of bits){
   b.vy+=b.g;b.x+=b.vx;b.y+=b.vy;b.r+=b.vr;b.life++;
   if(b.y<innerHeight+30){alive++;
    ctx.save();ctx.translate(b.x,b.y);ctx.rotate(b.r);
    ctx.globalAlpha=Math.max(0,1-b.life/150);
    ctx.fillStyle=b.c;ctx.fillRect(-b.w/2,-b.h/2,b.w,b.h);ctx.restore();}
  }
  if(alive&&now-t0<4200)requestAnimationFrame(frame);
  else{ctx.clearRect(0,0,innerWidth,innerHeight);cv.hidden=true}
 })(t0);
}

/* resolve reviewer names where the platform tells us */
async function paintNames(){
 if(!USER)return;
 const nodes=Array.from(document.querySelectorAll(".verdict[data-by]")).filter(n=>n.dataset.by);
 if(!nodes.length)return;
 try{
  const map=await USER.profiles(Array.from(new Set(nodes.map(n=>n.dataset.by))));
  nodes.forEach(n=>{const p=map&&map[n.dataset.by];const nm=p&&(p.name||"");
   const slot=n.querySelector(".byname"); if(slot&&nm)slot.textContent=" · by "+nm;});
 }catch(e){}
}
const _render=render;
render=function(){_render();paintNames()};

boot();
})();
</script>
